// A protobuf-based API for communication between
// the Warp client and the remote server binary.
//
// Messages are length-prefixed: [4-byte little-endian length][protobuf bytes].

syntax = "proto3";

package remote_server;

// ── Top-level envelopes ───────────────────────────────────────────

// Top-level envelope for all client → server messages.
message ClientMessage {
  string request_id = 1;
  oneof message {
    Initialize initialize = 2;
    Abort abort = 3;
    NavigatedToDirectory navigated_to_directory = 4;
    LoadRepoMetadataDirectory load_repo_metadata_directory = 5;
    SessionBootstrapped session_bootstrapped = 6;
    WriteFile write_file = 7;
    DeleteFile delete_file = 8;
    RunCommandRequest run_command = 9;
    ReadFileContextRequest read_file_context = 10;
    Authenticate authenticate = 11;
    OpenBuffer open_buffer = 13;
    BufferEdit buffer_edit = 14;
    CloseBuffer close_buffer = 15;
    SaveBuffer save_buffer = 16;
    ResolveConflict resolve_conflict = 17;
    ListDirectory list_directory = 18;
    ResolvePath resolve_path = 19;
    CreateDirectory create_directory = 20;
    ReadFileChunk read_file_chunk = 21;
    WriteFileChunk write_file_chunk = 22;
    // zaplex native session host (see the "Native Remote Session Layer"
    // section at the end of this file).
    OpenSession open_session = 23;
    AttachSession attach_session = 24;
    DetachSession detach_session = 25;
    SessionInput session_input = 26;
    ResizeSession resize_session = 27;
    CloseSession close_session = 28;
    ListSessions list_sessions = 29;
    // Agent-session inventory (Agent-Cockpit): the host's Claude/Codex
    // transcript-backed agent-sessions, a different axis from the PTY sessions
    // above. See the "Agent-Session Inventory" section at the end of this file.
    ListAgentSessions list_agent_sessions = 30;
    // Session-less one-shot host command (Agent-Cockpit remote guardrails). See
    // the "Session-less Host Command" section at the end of this file.
    HostExec host_exec = 31;
    // Reports where a session's bootstrap handshake completed so the daemon can
    // freeze an eviction-proof preamble for later adopts (T1.3).
    SetBootstrapPreamble set_bootstrap_preamble = 32;
    // Narrow, identity-verified Agent-Cockpit process signalling. This is
    // deliberately separate from HostExec: callers can request only Interrupt
    // or Kill and must provide the process identity discovered for the session.
    AgentProcessSignalRequest agent_process_signal = 33;
    // Generation-checked association between a CLI-agent conversation and the
    // daemon-owned PTY that currently hosts it.
    BindAgentPty bind_agent_pty = 34;
    UnbindAgentPty unbind_agent_pty = 35;
    // Descriptor-bound, journaled file transaction. Clients must negotiate
    // "safe-file-transactions-v1" before using this request.
    SafeFileRequest safe_file = 36;
    // Typed inventory of existing tmux/byobu sessions. Clients must negotiate
    // "multiplexer-inventory-v1" before using this request.
    ListMultiplexerSessions list_multiplexer_sessions = 37;
    // Secret-free daemon-local AI-account inventory. Clients must negotiate
    // "agent-account-routing-v1" before using this request or selecting an
    // account on OpenSession.
    ListAgentAccounts list_agent_accounts = 38;
    // Bounded, provider-neutral transcript snapshot resolved entirely on the
    // daemon host. Clients must negotiate "agent-transcript-read-v1".
    ReadAgentTranscript read_agent_transcript = 39;
    // Generation-checked managed-agent lifecycle. Clients must negotiate
    // "managed-agent-fleet-v1"; no HostExec fallback is permitted.
    ManagedSessionLifecycleRequest managed_session_lifecycle = 40;
  }
}
// Top-level envelope for all server → client messages.
// Push messages use an empty request_id to distinguish them from
// request/response pairs.
message ServerMessage {
  string request_id = 1;
  oneof message {
    InitializeResponse initialize_response = 2;
    ErrorResponse error = 3;
    NavigatedToDirectoryResponse navigated_to_directory_response = 4;
    RepoMetadataSnapshot repo_metadata_snapshot = 5;
    RepoMetadataUpdatePush repo_metadata_update = 6;
    LoadRepoMetadataDirectoryResponse load_repo_metadata_directory_response = 7;
    WriteFileResponse write_file_response = 8;
    DeleteFileResponse delete_file_response = 9;
    RunCommandResponse run_command_response = 10;
    ReadFileContextResponse read_file_context_response = 11;
    OpenBufferResponse open_buffer_response = 14;
    BufferUpdatedPush buffer_updated = 15;
    SaveBufferResponse save_buffer_response = 16;
    ResolveConflictResponse resolve_conflict_response = 17;
    ListDirectoryResponse list_directory_response = 18;
    ResolvePathResponse resolve_path_response = 19;
    CreateDirectoryResponse create_directory_response = 20;
    ReadFileChunkResponse read_file_chunk_response = 21;
    WriteFileChunkResponse write_file_chunk_response = 22;
    // zaplex native session host (see the "Native Remote Session Layer"
    // section at the end of this file).
    SessionOpened session_opened = 23;
    SessionAttached session_attached = 24;
    SessionList session_list = 25;
    // The following three are pushes (empty request_id):
    SessionOutput session_output = 26;
    SessionExited session_exited = 27;
    SessionNotice session_notice = 28;
    // Agent-session inventory response (Agent-Cockpit). See the
    // "Agent-Session Inventory" section at the end of this file.
    AgentSessionList agent_session_list = 29;
    // Session-less one-shot host command result. See the "Session-less Host
    // Command" section at the end of this file.
    HostExecResult host_exec_result = 30;
    // Correlated acceptance result for retry-safe startup input. Ordinary
    // SessionInput notifications do not produce this response.
    StartupCommandAck startup_command_ack = 31;
    // Correlated, typed result for AgentProcessSignalRequest.
    AgentProcessSignalResponse agent_process_signal_response = 32;
    // Correlated, typed result for BindAgentPty / UnbindAgentPty.
    AgentPtyBindingResponse agent_pty_binding_response = 33;
    SafeFileResponse safe_file_response = 34;
    MultiplexerSessionList multiplexer_session_list = 35;
    AgentAccountInventory agent_account_inventory = 36;
    AgentTranscriptResponse agent_transcript_response = 37;
    ManagedSessionLifecycleResponse managed_session_lifecycle_response = 38;
  }
}

// ── Initialize handshake

// Sent by the client immediately after connecting to negotiate the protocol.
message Initialize {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
  // Capabilities understood by this client. Old clients omit this field and
  // therefore cannot mutate or trust generation-checked PTY bindings.
  repeated string features = 2;
}

// Sent by the client when its bearer credential rotates after initialization.
// This is a notification (fire-and-forget) — the server does not send a response.
message Authenticate {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
}

// Sent by the client to cancel an in-progress request.
// This is a notification (fire-and-forget) — the server does not send a response.
message Abort {
  string request_id_to_abort = 1;
}

// Returned by the server in response to Initialize.
message InitializeResponse {
  string server_version = 1;
  string host_id = 2;
  // Capabilities advertised by the daemon (values defined in
  // zaplex_remote_session::types, e.g. "session-host"). Old daemons omit this
  // field → it decodes as empty → the client falls back to the existing
  // no-session-host behaviour. Used for capability negotiation.
  repeated string features = 3;
}

// Sent by the client after the SSH session has been bootstrapped.
// This is a notification (fire-and-forget) — the server does not send a
// response. The server uses this to create a per-session
// LocalCommandExecutor matching the bootstrapped shell.
message SessionBootstrapped {
  uint64 session_id = 1;
  string shell_type = 2;
  // The full path to the shell binary (e.g. "/usr/bin/zsh").
  // When present, the server uses this directly instead of doing a PATH lookup.
  optional string shell_path = 3;
}

// Sent by the client to execute a shell command on the remote host.
message RunCommandRequest {
  string command = 1;
  // Working directory for the command. If empty, uses the server's default.
  optional string working_directory = 2;
  // Environment variables to set for the command.
  map<string, string> environment_variables = 3;
  // The session whose shell executor should run this command.
  uint64 session_id = 4;
}

// Specific error codes for RunCommandRequest failures.
enum RunCommandErrorCode {
  RUN_COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  // The session ID has no associated executor (session was never bootstrapped).
  SESSION_NOT_FOUND = 1;
  // The command could not be executed (e.g. the shell process failed to spawn).
  EXECUTION_FAILED = 2;
}

message RunCommandError {
  RunCommandErrorCode code = 1;
  string message = 2;
}

message RunCommandSuccess {
  bytes stdout = 1;
  bytes stderr = 2;
  // Absent when the process was killed by a signal (Unix).
  optional int32 exit_code = 3;
}

// Returned by the server with the result of a RunCommandRequest.
message RunCommandResponse {
  oneof result {
    RunCommandSuccess success = 1;
    RunCommandError error = 2;
  }
}

// ── Shared error response ─────────────────────────────────────────

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request was malformed (e.g. missing oneof variant).
  INVALID_REQUEST = 1;
  // An unexpected server-side failure.
  INTERNAL = 2;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

// ── Shared repo metadata sub-messages ─────────────────────────────
// Mirror the Rust types in repo_metadata/src/file_tree_update.rs.

// Mirrors RepoNodeMetadata in Rust.
message RepoNodeMetadata {
  oneof node {
    DirectoryNodeMetadata directory = 1;
    FileNodeMetadata file = 2;
  }
}

// Mirrors DirectoryNodeMetadata in Rust.
message DirectoryNodeMetadata {
  string path = 1;
  bool ignored = 2;
  bool loaded = 3;
}

// Mirrors FileNodeMetadata in Rust.
message FileNodeMetadata {
  string path = 1;
  optional string extension = 2;
  bool ignored = 3;
}

// Mirrors FileTreeEntryUpdate in Rust. Describes a subtree patch rooted
// at a parent directory.
message RepoMetadataEntryUpdate {
  string parent_path_to_replace = 1;
  repeated RepoNodeMetadata subtree_metadata = 2;
}

// ── NavigatedToDirectory ──────────────────────────────────────────

// Client → server: "I navigated to this directory, please index it."
message NavigatedToDirectory {
  string path = 1;
}

// Response after the server has run git detection on the requested path.
// When is_git is true, indexed_path is the git repo root and full indexing
// runs in the background. A RepoMetadataSnapshot push will follow.
// When is_git is false, the directory was lazily indexed at first level.
// A RepoMetadataSnapshot push with the lazy tree data will follow.
message NavigatedToDirectoryResponse {
  string indexed_path = 1;
  bool is_git = 2;
}

// ── LoadRepoMetadataDirectory ─────────────────────────────────────

// Client → server: load the next level of a subdirectory within an
// already-tracked repo (lazy expand).
message LoadRepoMetadataDirectory {
  string repo_path = 1;
  string dir_path = 2;
}

// Response with the loaded subtree entries for the requested directory.
message LoadRepoMetadataDirectoryResponse {
  string repo_path = 1;
  string dir_path = 2;
  repeated RepoMetadataEntryUpdate entries = 3;
}

// ── File write/delete operations ──────────────────────────────────

// Shared error type for file operations (read/write/delete).
message FileOperationError {
  string message = 1;
}

// Client → server: write content to a file, creating parent dirs if needed.
message WriteFile {
  string path = 1;
  string content = 2;
}

// Server → client: result of a WriteFile request.
message WriteFileResponse {
  oneof result {
    WriteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileSuccess {}

// Client → server: delete a file.
message DeleteFile {
  string path = 1;
}

// Server → client: result of a DeleteFile request.
message DeleteFileResponse {
  oneof result {
    DeleteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message DeleteFileSuccess {}

// ── Read file context (batch) ─────────────────────────────────────

// A single file to read, with optional line ranges.
message ReadFileContextFile {
  string path = 1;
  // 1-indexed line ranges (start..end). Empty = read entire file.
  repeated LineRange line_ranges = 2;
}

message LineRange {
  uint32 start = 1;
  uint32 end = 2;
}

// Client → server: batch read multiple files with full context.
message ReadFileContextRequest {
  repeated ReadFileContextFile files = 1;
  // Per-file byte limit. Absent = use server default.
  optional uint32 max_file_bytes = 2;
  // Cumulative byte budget across all files. Absent = no batch limit.
  optional uint32 max_batch_bytes = 3;
}

// Server → client: result of a ReadFileContextRequest.
// Per-file failures are reported in `failed_files`, not as a top-level error.
// Catastrophic server errors (malformed request, etc.) use the generic ErrorResponse.
message ReadFileContextResponse {
  repeated FileContextProto file_contexts = 1;
  repeated FailedFileRead failed_files = 2;
}

message FailedFileRead {
  string path = 1;
  FileOperationError error = 2;
}

message FileContextProto {
  string file_name = 1;
  oneof content {
    string text_content = 2;
    bytes binary_content = 3;
  }
  // Optional 1-indexed line range this segment covers.
  optional uint32 line_range_start = 4;
  optional uint32 line_range_end = 5;
  optional uint64 last_modified_epoch_millis = 6;
  uint32 line_count = 7;
}

// ── Server → client push messages ─────────────────────────────────

// Full or lazy-loaded repo metadata snapshot. Pushed by the server after
// NavigatedToDirectory completes indexing (either lazy or full git).
message RepoMetadataSnapshot {
  string repo_path = 1;
  repeated RepoMetadataEntryUpdate entries = 2;
  bool sync_complete = 3;
}

// Incremental repo metadata update. Mirrors RepoMetadataUpdate in Rust.
message RepoMetadataUpdatePush {
  string repo_path = 1;
  repeated string remove_entries = 2;
  repeated RepoMetadataEntryUpdate update_entries = 3;
}

// ── Buffer syncing ────────────────────────────────────────────────

// Client → server: open a buffer for bidirectional syncing.
// The server reads the file, starts watching it, and returns the content.
message OpenBuffer {
  string path = 1;
}

// Server → client: response to OpenBuffer with the initial file content.
message OpenBufferResponse {
  string content = 1;
  uint64 server_version = 2;
}

// Client → server: push an incremental edit (fire-and-forget notification).
// If the server accepts (expected_server_version matches its local version),
// it applies the edit silently — no response needed since the client already
// has the edit applied locally.
// If the server rejects (version mismatch), the edit is silently dropped;
// the client discovers the divergence on the next file-watcher
// BufferUpdatedPush that carries the server's current state. (The earlier
// "server pushes BufferUpdatedPush on reject" wording did not match the
// implementation and has been removed.)
//
// V0 limitation (single-client per buffer): when buffer B is open on
// connections A and C, an accepted BufferEdit from A is NOT forwarded to
// C. SyncClock.client_version is daemon-wide rather than per-connection,
// so there is no safe expected_client_version to put in a push targeted
// at C. Multi-client push is tracked as follow-up work; until then, only
// one client should hold a writable view of a remote buffer at a time.
message BufferEdit {
  string path = 1;
  uint64 expected_server_version = 2;
  uint64 new_client_version = 3;
  repeated TextEdit edits = 4;
}

// A single text edit within a buffer, using 1-indexed character offsets (matching CharOffset).
message TextEdit {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string text = 3;
}

// Server → client push: file changed on disk.
// The client uses expected_client_version to detect conflicts.
// Carries only incremental edits — full content is served by OpenBufferResponse.
message BufferUpdatedPush {
  string path = 1;
  uint64 new_server_version = 2;
  uint64 expected_client_version = 3;
  repeated TextEdit edits = 4;
}

// Client → server: close a buffer (stop watching).
message CloseBuffer {
  string path = 1;
}

// Client → server: persist the current in-memory buffer to disk.
message SaveBuffer {
  string path = 1;
}

// Server → client: result of a SaveBuffer request.
message SaveBufferResponse {
  oneof result {
    SaveBufferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message SaveBufferSuccess {}

// Client → server: resolve a conflict by accepting the client's content.
// The server replaces its in-memory buffer with client_content,
// updates the clock to {acknowledged_server_version, current_client_version},
// and persists to disk (updates base_content_version to avoid re-triggering).
// For "accept server", the client simply re-sends OpenBuffer instead.
message ResolveConflict {
  string path = 1;
  uint64 acknowledged_server_version = 2;
  string client_content = 3;
  uint64 current_client_version = 4;
}

// Server → client: result of a ResolveConflict request.
message ResolveConflictResponse {
  oneof result {
    ResolveConflictSuccess success = 1;
    FileOperationError error = 2;
  }
}

message ResolveConflictSuccess {}

// ── ListDirectory ─────────────────────────────────────────────────
// Zap: terminal file link remote precise verification. When client Ctrl/Cmd+clicks file path in remote SSH session,
// needs to know true directory entries under some cwd to accurately extract filename from `ls -l` full-line output
// (local session uses `fs::metadata` existence check to do this; remote files not on local disk).

// Client → server: list the immediate entries of a directory.
message ListDirectory {
  string path = 1;
}

enum FileSystemEntryKind {
  FILE_SYSTEM_ENTRY_KIND_UNSPECIFIED = 0;
  FILE = 1;
  DIRECTORY = 2;
  SYMLINK = 3;
  OTHER = 4;
}

// A single directory entry returned by ListDirectory.
message DirEntry {
  string name = 1;
  bool is_dir = 2;
  FileSystemEntryKind kind = 3;
  optional uint64 size_bytes = 4;
  optional uint64 modified_epoch_millis = 5;
}

// Server → client: the entries contained directly in the requested directory.
message ListDirectorySuccess {
  repeated DirEntry entries = 1;
  string canonical_path = 2;
}

// Server → client: result of a ListDirectory request.
message ListDirectoryResponse {
  oneof result {
    ListDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Server file browser operations ────────────────────────────────

message ResolvePath {
  string path = 1;
}

message ResolvePathSuccess {
  string canonical_path = 1;
  FileSystemEntryKind kind = 2;
  optional uint64 size_bytes = 3;
}

message ResolvePathNotFound {
  string message = 1;
}

message ResolvePathResponse {
  oneof result {
    ResolvePathSuccess success = 1;
    FileOperationError error = 2;
    ResolvePathNotFound not_found = 3;
  }
}

message CreateDirectory {
  string path = 1;
}

message CreateDirectorySuccess {
  string canonical_path = 1;
}

message CreateDirectoryResponse {
  oneof result {
    CreateDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

message ReadFileChunk {
  string path = 1;
  uint64 offset = 2;
  uint64 max_bytes = 3;
}

message ReadFileChunkSuccess {
  bytes bytes = 1;
  uint64 next_offset = 2;
  optional uint64 total_size = 3;
  bool eof = 4;
}

message ReadFileChunkResponse {
  oneof result {
    ReadFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileChunk {
  string path = 1;
  uint64 offset = 2;
  bytes bytes = 3;
  bool truncate = 4;
  optional bool executable = 5;
}

message WriteFileChunkSuccess {
  uint64 next_offset = 1;
}

message WriteFileChunkResponse {
  oneof result {
    WriteFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Safe file transactions ───────────────────────────────────────

enum SafeFileEntryKind {
  SAFE_FILE_ENTRY_KIND_UNSPECIFIED = 0;
  SAFE_FILE_ENTRY_KIND_REGULAR = 1;
  SAFE_FILE_ENTRY_KIND_DIRECTORY = 2;
  SAFE_FILE_ENTRY_KIND_SYMLINK = 3;
}

message SafeFileIdentity {
  SafeFileEntryKind kind = 1;
  uint64 size = 2;
  // Unix device + inode encoded as an opaque token. Clients compare it but
  // never interpret it.
  string object_id = 3;
  // Includes size and modification time so content changes on the same inode
  // are visible while a path-only rename keeps the revision stable.
  string revision = 4;
}

message SafeFileOpenExisting {
  string path = 1;
  SafeFileEntryKind expected_kind = 2;
}

message SafeFileCreateExclusive {
  string path = 1;
  SafeFileEntryKind kind = 2;
}

message SafeFileReadHandle {
  string handle_id = 1;
  uint64 max_bytes = 2;
}

message SafeFileWriteHandle {
  string handle_id = 1;
  bytes bytes = 2;
}

message SafeFileFlushHandle {
  string handle_id = 1;
}

message SafeFileInspectHandle {
  string handle_id = 1;
  string path = 2;
}

message SafeFileCloseHandle {
  string handle_id = 1;
}

enum SafeFileRenameMode {
  SAFE_FILE_RENAME_MODE_UNSPECIFIED = 0;
  SAFE_FILE_RENAME_MODE_NO_REPLACE = 1;
  SAFE_FILE_RENAME_MODE_EXCHANGE = 2;
}

message SafeFileRename {
  string handle_id = 1;
  string old_path = 2;
  string new_path = 3;
  SafeFileRenameMode mode = 4;
  // Required for exchange. The mutation is refused if the destination is no
  // longer this exact object.
  optional SafeFileIdentity expected_target = 5;
}

message SafeFileDelete {
  string path = 1;
  SafeFileIdentity expected = 2;
  // Required for regular files and omitted for empty directories.
  optional string expected_sha256 = 3;
}

message SafeFileListRecoveries {}

message SafeFileRetryRecovery {}

message SafeFileRequest {
  // Required for create/rename/delete. Reusing an id returns the persisted
  // result instead of executing a second mutation.
  string operation_id = 1;
  oneof operation {
    SafeFileOpenExisting open_existing = 2;
    SafeFileCreateExclusive create_exclusive = 3;
    SafeFileReadHandle read_handle = 4;
    SafeFileWriteHandle write_handle = 5;
    SafeFileFlushHandle flush_handle = 6;
    SafeFileInspectHandle inspect_handle = 7;
    SafeFileCloseHandle close_handle = 8;
    SafeFileRename rename = 9;
    SafeFileDelete delete = 10;
    SafeFileListRecoveries list_recoveries = 11;
    SafeFileRetryRecovery retry_recovery = 12;
  }
}

message SafeFileOpened {
  string handle_id = 1;
  SafeFileIdentity identity = 2;
}

message SafeFileReadResult {
  bytes bytes = 1;
  bool eof = 2;
}

message SafeFileInspectResult {
  SafeFileIdentity identity = 1;
  bool matches_path = 2;
  optional uint64 link_count = 3;
}

enum SafeFileMutationState {
  SAFE_FILE_MUTATION_STATE_UNSPECIFIED = 0;
  SAFE_FILE_MUTATION_STATE_APPLIED = 1;
  SAFE_FILE_MUTATION_STATE_ALREADY_APPLIED = 2;
}

message SafeFileMutationResult {
  SafeFileMutationState state = 1;
}

message SafeFileRecovery {
  string operation_id = 1;
  repeated string paths = 2;
  // A successfully reconciled rename commits the destination while leaving
  // the higher-level move source intact. The client uses this to report the
  // recovered transfer honestly instead of presenting it as a completed move.
  bool source_preserved_after_commit = 3;
}

message SafeFileRecoveryList {
  repeated SafeFileRecovery recoveries = 1;
}

message SafeFileResponse {
  oneof result {
    SafeFileOpened opened = 1;
    SafeFileReadResult read = 2;
    SafeFileInspectResult inspected = 3;
    SafeFileMutationResult mutation = 4;
    SafeFileRecoveryList recoveries = 5;
    FileOperationError error = 15;
  }
}

// ── Native Remote Session Layer (zaplex native session host) ──────────
// See docs/superpowers/plans/2026-06-24-native-remote-session-layer.md.
//
// The daemon owns the PTY and spawns the user shell itself; PTY bytes are
// pushed to the currently attached connection via SessionOutput. After a
// disconnect the session keeps living on the daemon side, and on reconnect the
// client replays the delta from the ring buffer using last_seq — so
// persistence lives in the daemon, not in the volatile SSH connection. The
// mouse uses the standard SGR reporting path (no multiplexer nesting); resize
// goes through TIOCSWINSZ.
//
// Stage 0 (this commit) only defines the wire format; the daemon-side handlers
// land from Stage 1 onward. Until then these messages are rejected with
// INVALID_REQUEST (honest refusal, see the server_model dispatch).

// Terminal window size (rows/cols + optional pixels), used by OpenSession /
// ResizeSession / SessionAttached.
message SessionSize {
  uint32 rows = 1;
  uint32 cols = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
}

// Client → daemon: open a new session whose PTY is owned by the daemon.
message OpenSession {
  // Working directory; empty means the daemon default (user home).
  optional string cwd = 1;
  // Shell executable path; empty means the login shell.
  optional string shell = 2;
  // Environment variables injected into the shell.
  map<string, string> env = 3;
  // Initial window size.
  SessionSize size = 4;
  // Per-host scrollback/replay buffer ceiling in bytes for this session's
  // OutputRing. Absent or 0 means the daemon uses its built-in default.
  optional uint64 ring_ceiling_bytes = 5;
  // Daemon-local account identity selected from AgentAccountInventory. The
  // client never sends a CLAUDE_CONFIG_DIR/CODEX_HOME path across this wire;
  // the daemon resolves this opaque id on its own host and injects the matching
  // provider environment variable before spawning the shell.
  AgentLaunchRoute agent_launch_route = 6;
  // Optional daemon-owned managed-agent launch. Absence preserves the legacy
  // ordinary PTY contract exactly.
  ManagedLaunch managed_launch = 7;
  // A client may raise, but never lower, the daemon headroom floor.
  optional uint64 requested_min_available_bytes = 8;
}

message ManagedLaunch {
  uint32 schema_version = 1;
  string launch_id = 2;
  string provider = 3;
  string project_root = 4;
  // "interactive-agent" or "claude-remote-control".
  string kind = 5;
  string spawn_mode = 6;
  uint32 capacity = 7;
  string permission_mode = 8;
  string display_name = 9;
}

// Daemon → client: OpenSession succeeded, returns the newly assigned
// persistent session id.
message SessionOpened {
  string session_id = 1;
  // Monotonic daemon-process generation used to reject stale PTY ids.
  uint64 generation = 2;
}

// Client → daemon: attach to an existing session and start receiving live
// output.
message AttachSession {
  string session_id = 1;
  // Highest output seq the client has already consumed; 0 means replay
  // everything available from the earliest point in the ring buffer.
  uint64 last_seq = 2;
  // Whether this client understands `SessionAttached.bootstrap_preamble` (T1.3).
  // Old clients omit this → it decodes as false → the daemon serves a plain
  // replay from `last_seq` exactly as before (never shifting the replay past a
  // preamble the client cannot consume), so new-daemon↔old-client stays
  // wire-transparent.
  bool supports_bootstrap_preamble = 3;
  // When present, attach succeeds only for this exact PTY generation. Old
  // clients omit it and retain their legacy id-only reconnect behavior.
  optional uint64 expected_generation = 4;
  // Optional foreground-agent identity captured from the same capability-gated
  // inventory row. When present, attach succeeds only while this exact agent
  // still owns the PTY foreground, preventing a stale row from opening a later
  // handoff target. Legacy clients omit it.
  AgentSessionIdentity expected_agent_binding = 5;
}

// Daemon → client: attach succeeded, with replay data and the current size.
message SessionAttached {
  string session_id = 1;
  SessionSize size = 2;
  // The seq of the first byte of the replay data.
  uint64 base_seq = 3;
  // Historical PTY bytes from after last_seq up to now (may be empty).
  bytes replay = 4;
  // The session's frozen bootstrap-handshake prefix: the raw captured output
  // bytes [0, end_seq) up to where the opening client reported bootstrap complete
  // (so it contains the InitShell…Bootstrapped DCS plus any interleaved banner /
  // prompt output). Sent only for an opted-in fresh adopt whose ring has evicted
  // its start (`base_seq() > 0`), when `replay` may no longer carry the handshake
  // (T1.3). Empty otherwise: opt-out clients, a reconnect (`last_seq > 0`), a
  // session with nothing evicted, or one whose capture was never frozen /was
  // abandoned. The client feeds this through the normal parser path *before* the
  // replay to arm bootstrap (no client-side state-machine surgery). `base_seq`
  // already accounts for it: it points at the first replay byte at or after the
  // preamble's end, so preamble and replay never overlap.
  bytes bootstrap_preamble = 5;
  // Exact generation of the attached PTY.
  uint64 generation = 6;
  // Current foreground agent for capability-aware clients. This hydrates
  // lifecycle routing after a generic sidebar adopt where no agent row was
  // available at the callsite. Absent is the safe legacy/unbound default.
  AgentSessionIdentity agent_binding = 7;
}

// Client → daemon: report the byte boundary at which this session's Zaplexify
// bootstrap handshake completed (notification, no response). Sent once, by the
// client that *opened* the session, the moment its terminal model becomes
// bootstrapped — `end_seq` is that client's output cursor at that point. The
// daemon freezes the output bytes it accumulated from seq 0 up to `end_seq` as
// the session's `bootstrap_preamble`, immune to later ring eviction, so a future
// adopt can still arm bootstrap. Idempotent: ignored once the preamble is frozen.
message SetBootstrapPreamble {
  string session_id = 1;
  uint64 end_seq = 2;
}

// Client → daemon: detach (notification, no response). The session keeps
// living on the daemon side.
message DetachSession {
  string session_id = 1;
}

// Client → daemon: write bytes into the PTY. Ordinary keyboard/mouse input has
// an empty startup_command_id and remains a notification with no response.
// Startup commands carry a stable non-empty id and a non-empty envelope
// request_id; the daemon responds with StartupCommandAck and deduplicates
// retries by this id after the ordered writer has accepted the bytes.
message SessionInput {
  string session_id = 1;
  bytes bytes = 2;
  string startup_command_id = 3;
}

// Daemon → client: correlated acceptance result for startup SessionInput.
// accepted=true means the bytes were accepted by the ordered writer, or the
// same startup_command_id had already been accepted earlier. accepted=false
// means no bytes were accepted and the id remains retryable.
message StartupCommandAck {
  string session_id = 1;
  string startup_command_id = 2;
  bool accepted = 3;
}

// Client → daemon: resize the PTY window (notification, no response);
// TIOCSWINSZ on the daemon side.
message ResizeSession {
  string session_id = 1;
  SessionSize size = 2;
}

// Client → daemon: close the session and reclaim it (announced via
// SessionExited once the shell exits).
message CloseSession {
  string session_id = 1;
}

// Client → daemon: list the sessions the daemon currently owns (multi-session
// UI / adopt).
message ListSessions {}

// Summary information about a single session.
message SessionInfo {
  string session_id = 1;
  string title = 2;
  string cwd = 3;
  bool alive = 4;
  // Unix epoch millis of the last attach; 0 means never attached.
  uint64 last_attached_epoch_millis = 5;
  // This session's output-ring memory footprint on the host, in bytes — what
  // the daemon's memory governor accounts against the host cap. Surfaced so the
  // multi-session UI can show per-session RAM. 0 = unknown.
  uint64 ring_bytes = 6;
  uint64 generation = 7;
  ManagedSessionInfo managed = 8;
  MemoryMeasurement process_memory = 9;
}

// Daemon → client: result of ListSessions.
message SessionList {
  repeated SessionInfo sessions = 1;
  // Host-wide output-ring cap enforced by the daemon. Older daemons omit this
  // field, which decodes as 0 (unknown) and must not be guessed by the client.
  uint64 host_ring_cap_bytes = 2;
  MemoryMeasurement host_available_memory = 3;
  uint64 daemon_min_available_bytes = 4;
  uint64 collected_at_epoch_millis = 5;
  // Bounded, secret-free records for managed sessions that ended or were
  // explicitly stopped. They are explanatory/restart identities, not live
  // inventory rows.
  repeated ManagedSessionExitInfo recent_managed_exits = 6;
}

message ManagedSessionInfo {
  uint32 schema_version = 1;
  string provider = 2;
  string account_id = 3;
  string project_root = 4;
  string launch_kind = 5;
  string launch_id = 6;
  uint64 generation = 7;
}

message ManagedSessionExitInfo {
  ManagedSessionInfo managed = 1;
  string session_id = 2;
  optional int32 exit_code = 3;
  uint64 exited_at_epoch_millis = 4;
  // Fixed vocabulary only: "process-ended" or "stopped".
  string diagnostic_code = 5;
}

enum MemoryMeasurementStatus {
  MEMORY_MEASUREMENT_STATUS_UNSPECIFIED = 0;
  MEMORY_MEASUREMENT_STATUS_MEASURED = 1;
  MEMORY_MEASUREMENT_STATUS_UNAVAILABLE = 2;
  MEMORY_MEASUREMENT_STATUS_UNSUPPORTED = 3;
}

message MemoryMeasurement {
  MemoryMeasurementStatus status = 1;
  optional uint64 bytes = 2;
  string provenance = 3;
  string diagnostic_code = 4;
}

enum ManagedSessionLifecycleAction {
  MANAGED_SESSION_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  MANAGED_SESSION_LIFECYCLE_ACTION_STOP = 1;
  MANAGED_SESSION_LIFECYCLE_ACTION_RESTART = 2;
}

enum ManagedSessionLifecycleStatus {
  MANAGED_SESSION_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  MANAGED_SESSION_LIFECYCLE_STATUS_STOPPED = 1;
  MANAGED_SESSION_LIFECYCLE_STATUS_RESTARTED = 2;
  MANAGED_SESSION_LIFECYCLE_STATUS_NOT_RUNNING = 3;
  MANAGED_SESSION_LIFECYCLE_STATUS_STALE_IDENTITY = 4;
  MANAGED_SESSION_LIFECYCLE_STATUS_CAPABILITY_REQUIRED = 5;
  MANAGED_SESSION_LIFECYCLE_STATUS_BLOCKED = 6;
  MANAGED_SESSION_LIFECYCLE_STATUS_FAILED = 7;
}

message ManagedSessionLifecycleRequest {
  uint32 schema_version = 1;
  ManagedSessionLifecycleAction action = 2;
  string session_id = 3;
  uint64 expected_generation = 4;
  string launch_id = 5;
  string provider = 6;
  string account_id = 7;
  string project_root = 8;
}

message ManagedSessionLifecycleResponse {
  uint32 schema_version = 1;
  ManagedSessionLifecycleAction action = 2;
  ManagedSessionLifecycleStatus status = 3;
  string session_id = 4;
  uint64 generation = 5;
  string replacement_session_id = 6;
  uint64 replacement_generation = 7;
  string diagnostic_code = 8;
}

// Client → daemon: enumerate existing terminal-multiplexer sessions without
// attaching to them or interpolating their names into shell commands.
message ListMultiplexerSessions {}

enum MultiplexerKind {
  MULTIPLEXER_KIND_UNSPECIFIED = 0;
  MULTIPLEXER_KIND_TMUX = 1;
  MULTIPLEXER_KIND_BYOBU_TMUX = 2;
  MULTIPLEXER_KIND_BYOBU_SCREEN = 3;
}

// One attachable multiplexer session. `target` is the exact opaque value the
// backend reported and must be passed as one argv/data value when attaching;
// `name` is presentation-only and may omit a screen PID prefix.
message MultiplexerSessionInfo {
  MultiplexerKind kind = 1;
  string target = 2;
  string name = 3;
  // 0 means the backend did not report a reliable value.
  uint32 windows = 4;
  uint32 attached_clients = 5;
}

// Daemon → client: typed multiplexer inventory. A missing executable or an
// absent multiplexer server is an empty, successful result. Real scan failures
// remain visible through `warnings` and must not be rendered as an empty list.
message MultiplexerSessionList {
  repeated MultiplexerSessionInfo sessions = 1;
  repeated string warnings = 2;
}

// Daemon → client (push, empty request_id): live PTY output. seq is
// monotonically increasing, used for replay alignment on reconnect.
message SessionOutput {
  string session_id = 1;
  uint64 seq = 2;
  bytes bytes = 3;
}

// Daemon → client (push, empty request_id): the session's shell has exited.
message SessionExited {
  string session_id = 1;
  // Process exit code; absent when killed by a signal (Unix).
  optional int32 exit_code = 2;
}

// Daemon → client (push, empty request_id): an advisory about the session's
// runtime environment. v1 kind: "multiplexer-detected" — the session landed
// inside a terminal multiplexer (a hand-rolled auto-attach the spawn-env
// opt-outs couldn't suppress) even though zaplex owns persistence natively;
// `detail` names the multiplexer ("tmux"/"screen"). Additive: unknown kinds
// must be ignored by the client.
message SessionNotice {
  string session_id = 1;
  string kind = 2;
  string detail = 3;
}

// ── Agent-Session Inventory (zaplex Agent-Cockpit) ─────────────────────
//
// Agent-sessions (Claude/Codex CLI conversations, transcript-backed) are a
// SEPARATE axis from the PTY sessions above: a PTY hosts 0..n agent-sessions
// over its lifetime, and an agent-session can be dormant (Idle) with no live
// PTY at all. So the daemon reports them via their own request/response rather
// than overloading SessionInfo/SessionList.
//
// The daemon runs zaplex_cockpit's discovery on its OWN (remote) filesystem —
// discovering Claude accounts under the daemon's home and tailing their
// transcripts — and ships SessionSnapshot-shaped rows. The client then folds
// every host's rows (local + each daemon's) into the single unified
// Agent-Inventory tree.
//
// Capability: gated behind the "agent-inventory" feature in
// InitializeResponse.features (zaplex_remote_session::types::
// FEATURE_AGENT_INVENTORY). A client talking to an OLD daemon that does not
// advertise it must skip ListAgentSessions entirely and treat that host as
// contributing zero agent-sessions — never error the whole tree.

// Client → daemon: list the agent-sessions discoverable on the daemon's host.
message ListAgentSessions {}

// One agent-session row. Mirrors zaplex_cockpit::types::SessionSnapshot.
//
// `state` and `provider` are lowercase string enum-ish values rather than proto
// enums, deliberately: they keep the wire forward-compatible (an unknown future
// state decodes as a plain string the client folds as Idle / a plain provider)
// and avoid churning a proto enum for every classification tweak.
//   state    ∈ {"active","waiting","monitor","idle"}  (unknown → treated Idle)
//   provider ∈ {"claude","codex"}                      (unknown → treated Claude)
//   effort   empty string = honestly unknown (maps back to Option::None)
message AgentSessionInfo {
  string session_id = 1;
  string cwd = 2;
  string name = 3;
  string state = 4;
  string provider = 5;
  string model = 6;
  string effort = 7;
  uint64 ctx_tokens = 8;
  string project_root = 9;
  string project_name = 10;
  uint64 last_activity_epoch_millis = 11;
  uint32 pid = 12;
  // Session identity for the redesigned sidebar (§2.2). Empty string = unknown
  // (maps back to Option::None), so an older daemon that omits these still
  // decodes cleanly.
  string worktree = 13;
  string branch = 14;
  // Legacy session route: the provider config dir ON THE HOST (a plexed
  // CODEX_HOME / CLAUDE_CONFIG_DIR). It remains for peers that did not negotiate
  // agent-account-routing-v1; capable peers receive account_id and this is empty.
  //
  // Routing only — NOT an account identity. It is a path on the daemon's host, so
  // it neither matches how the client spells the same account nor exists at all for
  // a default account. Use account_email to tell whose account a session is.
  string config_dir = 15;
  // Email of the account this session runs under: the cross-host join key (with
  // `provider`) that lets a client group the same subscription across hosts.
  // account_id below is deliberately daemon-local and is used for exact routing.
  //
  // Empty = the daemon could not determine it, or predates this field. Such a
  // session still folds into the host tree; it simply joins no account rather than
  // being guessed onto one.
  string account_email = 16;
  // Working-tree root of the REPO project_root belongs to (its main checkout when
  // project_root is a linked worktree, otherwise the same path). The inventory
  // groups on this, so several worktrees of one repo read as one project.
  //
  // Empty = the daemon predates this field; the client then groups that session by
  // its own project_root, i.e. the old worktree-per-project split. Degraded, not
  // mis-grouped.
  string repo_root = 17;
  // Opaque identity of the exact process observed during discovery. Empty means
  // unknown and therefore unsignalable. Additive so older daemons decode as the
  // safe empty value.
  string process_fingerprint = 18;
  // Present only for clients that negotiated "agent-pty-binding-v2". Empty/zero
  // values are the safe unbound defaults for old clients and daemons.
  string pty_session_id = 19;
  uint64 pty_session_generation = 20;
  bool pty_foreground = 21;
  // Latest structured task state parsed on the daemon host. The explicit
  // presence bit distinguishes "no supported task record" (and old daemons)
  // from a provider that deliberately emitted an empty list.
  bool has_task_state = 22;
  repeated AgentTaskItem task_items = 23;
  // Opaque daemon-local account identity. Present only when both peers
  // negotiated "agent-account-routing-v1"; config_dir is then empty.
  string account_id = 24;
}

message AgentTaskItem {
  string id = 1;
  string title = 2;
  // {"pending","in_progress","completed"}; unknown values decode as pending.
  string status = 3;
}

// Daemon → client: result of ListAgentSessions.
message AgentSessionList {
  repeated AgentSessionInfo sessions = 1;
}

// ── Agent Account Inventory + Launch Routing ─────────────────────────────
//
// Capability: "agent-account-routing-v1". Account ids are opaque, stable on
// one daemon host, and resolve only against an inventory produced by that
// daemon. No provider config path or credential crosses the protocol boundary.

message ListAgentAccounts {}

message AgentAccountInfo {
  string provider = 1;
  string account_id = 2;
  string display_label = 3;
  string email = 4;
  string organization = 5;
  string plan_tier = 6;
  bool is_default = 7;
  // Remaining capacity fractions in [0, 1]. They are safe for routing only
  // when capacity_known is true.
  double capacity_5h = 8;
  double capacity_week = 9;
  bool capacity_known = 10;
  // "loaded" or "degraded". Unknown future values must be treated degraded.
  string health = 11;
  // "real" or "estimate"; descriptive only, never a credential.
  string usage_provenance = 12;
}

message AgentAccountInventory {
  uint32 schema_version = 1;
  repeated AgentAccountInfo accounts = 2;
  // "loaded" or "degraded". An empty loaded inventory means no accounts;
  // degraded means discovery was incomplete and must not drive auto-routing.
  string health = 3;
  // Generic, path-free diagnostic suitable for logs/UI.
  string health_message = 4;
}

message AgentLaunchRoute {
  uint32 schema_version = 1;
  string provider = 2;
  string account_id = 3;
}

// ── Bounded Agent Transcript Read ────────────────────────────────────────
//
// Capability: "agent-transcript-read-v1". The request identifies only an
// opaque daemon account and stable provider session. Provider config paths are
// resolved on the daemon and never cross the wire. Responses contain the
// shared display projection only: visible conversation text, reasoning
// summaries and tool names. Tool arguments/results, encrypted payloads,
// credential stores and raw JSONL are never protocol data.

message ReadAgentTranscript {
  uint32 schema_version = 1;
  string provider = 2;
  string account_id = 3;
  string session_id = 4;
  // Optional opaque revision returned by an earlier snapshot. A matching
  // revision returns NOT_MODIFIED without retransmitting the transcript.
  string known_revision = 5;
}

enum AgentTranscriptStatus {
  AGENT_TRANSCRIPT_STATUS_UNSPECIFIED = 0;
  AGENT_TRANSCRIPT_STATUS_LOADED = 1;
  AGENT_TRANSCRIPT_STATUS_NOT_MODIFIED = 2;
  AGENT_TRANSCRIPT_STATUS_MISSING = 3;
  AGENT_TRANSCRIPT_STATUS_EMPTY = 4;
  AGENT_TRANSCRIPT_STATUS_UNSUPPORTED = 5;
  AGENT_TRANSCRIPT_STATUS_MALFORMED = 6;
  AGENT_TRANSCRIPT_STATUS_TOO_LARGE = 7;
  AGENT_TRANSCRIPT_STATUS_INVALID_REQUEST = 8;
  AGENT_TRANSCRIPT_STATUS_UNAVAILABLE = 9;
}

message AgentTranscriptTool {
  string name = 1;
}

message AgentTranscriptTurn {
  // "user" or "assistant". Unknown values must be ignored by clients.
  string role = 1;
  string text = 2;
  string thinking = 3;
  repeated AgentTranscriptTool tools = 4;
  string model = 5;
  string timestamp = 6;
}

message AgentTranscriptResponse {
  uint32 schema_version = 1;
  string provider = 2;
  string session_id = 3;
  AgentTranscriptStatus status = 4;
  repeated AgentTranscriptTurn turns = 5;
  // True when older turns or oversized display fields were omitted to stay
  // within the daemon's hard response limits.
  bool truncated = 6;
  // Opaque, path-free source revision for efficient polling.
  string source_revision = 7;
  // Generic path-free diagnostic. Never contains an OS error or provider path.
  string message = 8;
}

// ── Agent-to-PTY Binding ──────────────────────────────────────────────────
//
// A PTY can contain several historical agent conversations but exactly one
// live foreground agent. Switching foreground identity requires an explicit
// handoff from the identity currently reported by the daemon.
//
// Capability: "agent-pty-binding" documents the additive base schema;
// mutations and trusted attach require both peers to advertise
// "agent-pty-binding-v2". Older clients decode the additive inventory fields
// as unbound and never send these ops.

message AgentSessionIdentity {
  string session_id = 1;
  string provider = 2;
  string account_email = 3;
  string config_dir = 4;
  // Opaque daemon-local identity from AgentSessionInfo. New routing-capable
  // peers use this instead of transporting a host config path.
  string account_id = 5;
}

message BindAgentPty {
  AgentSessionIdentity agent = 1;
  string pty_session_id = 2;
  uint64 pty_session_generation = 3;
  AgentSessionIdentity handoff_from = 4;
  // Exact daemon process identity returned by InitializeResponse.host_id.
  // Additive: legacy payloads decode with the safe empty value and are
  // rejected rather than mutating a PTY on an unintended daemon instance.
  string host_id = 5;
}

message UnbindAgentPty {
  AgentSessionIdentity agent = 1;
  string pty_session_id = 2;
  uint64 pty_session_generation = 3;
  // Exact daemon process identity returned by InitializeResponse.host_id.
  string host_id = 4;
}

enum AgentPtyBindingStatus {
  AGENT_PTY_BINDING_STATUS_UNSPECIFIED = 0;
  AGENT_PTY_BINDING_STATUS_BOUND = 1;
  AGENT_PTY_BINDING_STATUS_UNBOUND = 2;
  AGENT_PTY_BINDING_STATUS_CAPABILITY_REQUIRED = 3;
  AGENT_PTY_BINDING_STATUS_PTY_NOT_FOUND = 4;
  AGENT_PTY_BINDING_STATUS_STALE_GENERATION = 5;
  AGENT_PTY_BINDING_STATUS_FOREIGN_CONNECTION = 6;
  AGENT_PTY_BINDING_STATUS_FOREGROUND_CONFLICT = 7;
  AGENT_PTY_BINDING_STATUS_HANDOFF_MISMATCH = 8;
  AGENT_PTY_BINDING_STATUS_IDENTITY_NOT_BOUND = 9;
  AGENT_PTY_BINDING_STATUS_INVALID_REQUEST = 10;
  AGENT_PTY_BINDING_STATUS_IDENTITY_ALREADY_BOUND = 11;
  AGENT_PTY_BINDING_STATUS_FOREIGN_DAEMON = 12;
  AGENT_PTY_BINDING_STATUS_IDENTITY_NOT_DISCOVERED = 13;
}

message AgentPtyBindingResponse {
  AgentPtyBindingStatus status = 1;
  string message = 2;
}

// ── Verified Agent Process Signal ─────────────────────────────────────────
//
// This is the only remote guardrail boundary. It accepts no command text and
// exposes only the two intentional process signals. The daemon re-verifies the
// opaque process fingerprint immediately before signalling, so a recycled pid
// cannot redirect Stop/Kill to a different process.
//
// Capability: gated behind "agent-process-signal-v1". A client talking to an
// older daemon must not fall back to HostExec or any shell command; it must
// report the guardrail as unsupported.

enum AgentProcessSignal {
  AGENT_PROCESS_SIGNAL_UNSPECIFIED = 0;
  AGENT_PROCESS_SIGNAL_INTERRUPT = 1;
  AGENT_PROCESS_SIGNAL_KILL = 2;
}

message AgentProcessSignalRequest {
  string session_id = 1;
  uint32 pid = 2;
  string expected_process_fingerprint = 3;
  AgentProcessSignal signal = 4;
}

enum AgentProcessSignalStatus {
  AGENT_PROCESS_SIGNAL_STATUS_UNSPECIFIED = 0;
  AGENT_PROCESS_SIGNAL_STATUS_SENT = 1;
  AGENT_PROCESS_SIGNAL_STATUS_STALE_IDENTITY = 2;
  AGENT_PROCESS_SIGNAL_STATUS_IDENTITY_UNVERIFIABLE = 3;
  AGENT_PROCESS_SIGNAL_STATUS_INVALID_REQUEST = 4;
  AGENT_PROCESS_SIGNAL_STATUS_SIGNAL_FAILED = 5;
}

message AgentProcessSignalResponse {
  string session_id = 1;
  uint32 pid = 2;
  AgentProcessSignalStatus status = 3;
  // Empty on success; human-readable diagnostic for a typed failure.
  string error_message = 4;
}

// ── Session-less Host Command ──────────────────────────────────────────────
//
// Unlike RunCommandRequest — which requires a bootstrapped session's
// LocalCommandExecutor (looked up by session_id) — HostExec runs one ad-hoc
// command on the daemon host WITHOUT any bound session. It is the general
// session-less host-command path, used by callers that hold a daemon
// connection but no interactive session on that host. Agent-Cockpit process
// guardrails must use AgentProcessSignalRequest instead.
//
// The daemon runs it in its default user shell (`$SHELL`, falling back to
// `/bin/bash`) rooted at the daemon's home directory, with no session state.
//
// Capability: gated behind the "host-exec" feature in
// InitializeResponse.features (zaplex_remote_session::types::FEATURE_HOST_EXEC).
// A client talking to an OLD daemon that does not advertise it must NOT send
// HostExec.

// Client → daemon: run one command session-lessly on the daemon host.
message HostExec {
  string command = 1;
}

// Daemon → client: result of a HostExec. A failure to even spawn the command
// comes back as a top-level ErrorResponse instead (mirrors other handlers).
message HostExecResult {
  bytes stdout = 1;
  bytes stderr = 2;
  optional int32 exit_code = 3;
}
