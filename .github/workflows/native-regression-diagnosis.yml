name: Diagnose native regressions

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Merged failing main commit for the original parallel app-smoke comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-regression-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    # ci-lint: allow-CI006  Main-only targeted diagnosis in an ephemeral VM
    runs-on: macrunner
    timeout-minutes: 35
    env:
      CHANNEL: oss
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require merged main sources
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          state=$(gh api "repos/byte5ai/zaplex/compare/$BASELINE_SHA...$GITHUB_SHA" --jq .status)
          [[ "$state" == ahead || "$state" == identical ]]
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: false
          cache_on_failure: true
          cache_workspace_crates: true
      - name: Compare only the failed native cases
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          RUST_BACKTRACE: '1'
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess, time
          from pathlib import Path

          source = os.environ["GITHUB_SHA"]
          baseline = os.environ["BASELINE_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          artifact = Path(os.environ["RUNNER_TEMP"]) / "native-regression-diagnosis"
          artifact.mkdir()
          boot = "workspace::view::tests::test_boot_registers_all_keybindings_without_panicking"

          def smoke_command():
              text = Path(".github/workflows/pr-check.yml").read_text()
              name = "cargo test (app dependency + UI smoke gates)"
              step = re.search(r"(?ms)^      - name: " + re.escape(name) + r"\n.*?(?=^      - |\Z)", text).group()
              body = re.search(r"(?ms)^        run: >\n(.*?)(?=^        shell:)", step)[1]
              return " ".join(line.strip() for line in body.splitlines())

          def execute(command, logfile):
              with logfile.open("w") as log:
                  result = subprocess.run(["/bin/bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", command],
                      stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, timeout=1200)
              text = logfile.read_text()
              for line in text.splitlines():
                  if line.startswith(("running ", "test result:", "error:", "Caused by:")) or "SIGABRT" in line:
                      print(line[:2000], flush=True)
              return result.returncode, text

          def selection(command, logfile):
              status, text = execute(command + " --list", logfile)
              assert status == 0, "The app-smoke test selection must compile"
              names = set(re.findall(r"^(\S+): test$", text, re.MULTILINE))
              assert len(names) == 113 and boot in names, "All 113 original app-smoke cases must be present"
              return names

          def crash_symbols(since):
              # Only public code symbols are exported, never raw OS reports or host metadata.
              reports = Path.home() / "Library/Logs/DiagnosticReports"
              for report in sorted(reports.glob("warp*.ips"), key=lambda p: p.stat().st_mtime, reverse=True):
                  if report.stat().st_mtime < since:
                      continue
                  try:
                      rest = report.read_text()
                      decoder = json.JSONDecoder()
                      while rest.strip():
                          document, end = decoder.raw_decode(rest.lstrip())
                          rest = rest.lstrip()[end:]
                          if not isinstance(document, dict) or "threads" not in document:
                              continue
                          threads = document["threads"]
                          thread = next((t for t in threads if t.get("triggered")), None)
                          if thread is None and isinstance(document.get("faultingThread"), int):
                              thread = threads[document["faultingThread"]]
                          return [frame["symbol"] for frame in (thread or {}).get("frames", [])
                                  if isinstance(frame.get("symbol"), str)][:40]
                  except (OSError, ValueError, IndexError, KeyError, TypeError):
                      continue
              return []

          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", baseline], check=True, timeout=60)
          try:
              subprocess.run(["git", "checkout", "--detach", baseline], check=True, timeout=60)
              original_command = smoke_command()
              original_cases = selection(original_command, artifact / "baseline-selection.txt")
              started = time.time()
              old_status, old_log = execute(original_command, artifact / "baseline-smoke.log")
              time.sleep(3)
              symbols = crash_symbols(started)
          finally:
              subprocess.run(["git", "checkout", "--detach", source], check=True, timeout=60)
          command = smoke_command()
          assert command == original_command, "The original parallel smoke command must remain unchanged"
          selected = selection(command, artifact / "corrected-selection.txt")
          assert selected == original_cases, "Both revisions must execute the identical case set"
          status, log = execute(command, artifact / "corrected-smoke.log")
          old_abort = old_status == 101 and "running 113 tests" in old_log and "SIGABRT" in old_log
          complete = status == 0 and "test result: ok. 113 passed; 0 failed; 0 ignored;" in log
          report = {"source_sha": source, "baseline_sha": baseline,
              "baseline_parallel_smoke_abort_reproduced": old_abort,
              "selected_case_count": len(selected), "corrected_parallel_smoke_passed": complete,
              "baseline_crash_symbols": symbols,
              "scope": "Original failed parallel app-smoke group only; no installed-DMG or product acceptance"}
          (artifact / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report), flush=True)
          assert old_abort, "The original parallel group did not reproduce its abort"
          assert complete, "All 113 corrected app-smoke cases must execute and pass"
          PYTHON
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-regression-diagnosis-${{ github.sha }}
          path: ${{ runner.temp }}/native-regression-diagnosis/
          if-no-files-found: warn
          retention-days: 14
