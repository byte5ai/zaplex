# Native batch validation: dependency policy, Clippy, compile and app regressions.
# Called after several merges; compilation is not a per-PR requirement.
name: PR Check

# Called only by the approved post-merge batch on main.
on:
  workflow_call:
    inputs:
      reuse_static_checks:
        description: Reuse source-bound static checks verified by the batch preflight
        type: boolean
        default: false
      reuse_native_checks:
        description: Reuse native gates independently verified by batch provenance
        type: boolean
        default: false
      passed_regression_steps:
        description: Exact successful unchanged steps verified by batch preflight
        type: string
        default: '[]'
      reuse_linux_checks:
        description: Reuse earlier native policy gates validated by the batch preflight
        type: boolean
        default: false

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: always
  # Kept consistent with zap_release.yml — only the oss channel can
  # cargo build/check without the private warp-channel-config repo.
  CHANNEL: oss

jobs:
  changes:
    if: ${{ !inputs.reuse_static_checks }}
    name: detect build-relevant changes
    runs-on: macrunner
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.detect.outputs.needs_build }}
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run static PR checks
        uses: ./.github/actions/static-pr-checks

      - name: Detect build-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # workflow_dispatch or similar: no PR diff to check against, so
            # always run the full build (safe default).
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_build=$(script/needs-build-check "$BASE_SHA")" >> "$GITHUB_OUTPUT"
        shell: bash

  cargo_check:
    name: cargo policy (macOS Apple Silicon)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.needs_build != 'false') && !inputs.reuse_linux_checks && !inputs.reuse_native_checks
    # General application policy belongs on the native client platform.
    runs-on: macrunner
    timeout-minutes: 60
    steps:
      # Only a successful, explicit docs-only decision may skip this required check.
      # A failed detector/static guard must fail here before checkout or compilation.
      - name: Require successful change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_BUILD: ${{ needs.changes.outputs.needs_build }}
          REUSE_STATIC: ${{ inputs.reuse_static_checks }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" && "$NEEDS_BUILD" == "true" ]] ||
          [[ "$CHANGES_RESULT" == "skipped" && "${REUSE_STATIC:-false}" == "true" ]] || {
            echo "Static PR checks or build-relevance detection did not succeed." >&2
            exit 1
          }

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Validate the gate before setup and compilation consume runner time.
      - uses: ./.github/actions/prepare-native-checks

      - name: Enforce compact sidebar row actions
        run: script/check-compact-row-actions
        shell: bash

      - name: Verify remote-server archive installation
        run: python3 script/remote-server-install-tests
        shell: bash

      # Keep this inside the required job for the same reason as the row-action
      # guard above: a broken Clippy gate must fail the batch.
      - name: Verify required Clippy gate
        run: script/pr-check-clippy-gate-tests
        shell: bash

      # These policy checks must fail the native policy context. Keeping them
      # in `changes` would turn this job into a passing skipped check on failure.
      - name: Verify license policy configuration
        run: script/check_license_config_sync
        shell: bash

      - name: Verify license policy guard
        run: script/check-license-config-sync-tests
        shell: bash

      - name: Verify dependency security baseline
        run: script/dependency-security-baseline-tests
        shell: bash

      # Audit contract regressions must fail this batch job. Running the
      # suite in `changes` would only turn this job into a passing "skipped" check.
      - name: Verify immutable codebase-audit pipeline
        run: |
          script/codebase-audit-inventory-tests
          script/codebase-audit-assignments-tests
          script/run-codebase-audit-assignments-tests
          script/aggregate-codebase-audit-results-tests
          script/codebase-audit-verification-assignments-tests
          script/run-codebase-audit-verification-assignments-tests
          script/codebase-audit-crosscut-evidence-tests
          script/codebase-audit-crosscut-assignments-tests
          script/run-codebase-audit-crosscut-assignments-tests
          script/aggregate-codebase-audit-verification-results-tests
        shell: bash

      - name: cargo deny check dependency policy
        uses: ./.github/actions/cargo-deny-native
        with:
          checks: advisories bans licenses sources

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          # Keep validated dependency artifacts when strict native lint finds a source error.
          cache_on_failure: true
          # cargo-about validates the exact third-party attribution that ships
          # in release bundles, while build deps provide protoc / libdbus etc.
          install_release_deps: true

      - name: Ensure rust target is installed
        run: rustup target add aarch64-apple-darwin
        shell: bash

      - name: Generate third-party license attribution
        run: >
          cargo about generate --workspace --manifest-path Cargo.toml
          -c about.toml -o "${RUNNER_TEMP}/THIRD_PARTY_LICENSES.txt" about.hbs
        shell: bash

      - name: cargo clippy (default = zaplex bin)
        # `cargo clippy --workspace` would pull in wasm/preview channel-gated
        # targets; lint only the default oss bin + its dependency graph, matching
        # the shipped native client target. Cargo.lock is committed, so run --locked
        # for a deterministic graph and deny the complete warning baseline.
        run: cargo clippy --locked --bin zaplex -- -D warnings
        shell: bash

  cargo_check_macos:
    name: cargo check (macOS Apple Silicon)
    needs: [changes, cargo_check]
    if: >
      !cancelled() && (needs.changes.outputs.needs_build == 'true' || inputs.reuse_static_checks) &&
      (needs.cargo_check.result == 'success' || inputs.reuse_linux_checks) && !inputs.reuse_native_checks
    # ci-lint: allow-CI006  Fork-PR-Approval: all external contributors; ephemere VM pro Job
    runs-on: macrunner
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify remote-server archive installation
        run: python3 script/remote-server-install-tests
        shell: bash

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-aarch64-check
          is_self_hosted: false
          install_release_deps: false

      - name: Ensure rust target is installed
        run: rustup target add aarch64-apple-darwin
        shell: bash

      - name: cargo check (default = zaplex bin)
        run: cargo check --locked --bin zaplex
        shell: bash

      - name: Native window mouse routing regressions
        run: >
          cargo test --locked -p warpui --lib platform::mac::window::tests:: -- --nocapture
        shell: bash

      - name: Native subscription Agent layout evidence
        env:
          WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: "1"
          ZAPLEX_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/subscription-agent-layout
          ZAPLEX_SHELL_PATH: /bin/zsh
        run: >
          cargo test --locked -p integration --test integration
          ui_tests::test_subscription_agent_conversation_layout_evidence
          -- --exact --nocapture
        shell: bash

      - name: Verify native subscription Agent screenshots
        run: |
          test "$(find "${{ runner.temp }}/subscription-agent-layout" -type f -name 'subscription-agent-normal-1180x640.png' -size +0c | wc -l | tr -d ' ')" -ge 1
          test "$(find "${{ runner.temp }}/subscription-agent-layout" -type f -name 'subscription-agent-narrow-540x670.png' -size +0c | wc -l | tr -d ' ')" -ge 1
        shell: bash

      - name: Upload native subscription Agent layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: subscription-agent-layout-evidence
          path: ${{ runner.temp }}/subscription-agent-layout/
          if-no-files-found: warn
          retention-days: 14

      - name: Native workspace interaction and layout evidence
        env:
          WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: "1"
          ZAPLEX_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/native-workspace
          ZAPLEX_SHELL_PATH: /bin/zsh
        run: |
          cargo test --locked -p integration --test integration \
            ui_tests::test_native_workspace_ -- --nocapture --test-threads=1
          cargo test --locked -p integration --test integration \
            ui_tests::test_native_file_manager_header_entry -- --exact --nocapture --test-threads=1
        shell: bash

      - name: Require every native workspace capture
        run: |
          set -euo pipefail
          for screenshot in \
            native-connections-dark-250 native-connections-dark-320 native-connections-dark-480 \
            native-connections-light-250 native-connections-light-320 native-connections-light-480 \
            native-favorite-flyout native-panes-side-by-side native-panes-after-drag \
            native-file-managers-normal native-file-managers-narrow \
            native-file-manager-focused-action native-file-managers-restored-terminals \
            file-manager-header-before file-manager-header-after; do
            test "$(find "${{ runner.temp }}/native-workspace" -type f -name "$screenshot.png" -size +0c | wc -l | tr -d ' ')" -ge 1
          done
        shell: bash

      - name: Bind native captures to their source and fixture scope
        env:
          NATIVE_ARTIFACT_PATH: ${{ runner.temp }}/native-workspace
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["NATIVE_ARTIFACT_PATH"])
          images = [{"path": str(path.relative_to(root)), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                    for path in sorted(root.rglob("*.png"))]
          (root / "evidence.json").write_text(json.dumps({
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "images": images,
              "scope": "Native app render/event assertions; deterministic labelled host/session inventory; real isolated local PTYs and files.",
              "not_covered": ["live SSH/daemon/provider acceptance", "OS reduced motion", "restart restore", "cross-host transfers"]
          }, indent=2) + "\n")
          PYTHON
        shell: bash

      - name: Upload native workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-workspace-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/native-workspace/
          if-no-files-found: warn
          retention-days: 14

  keymap_smoke_test:
    name: app regressions (macOS Apple Silicon)
    needs: [changes, cargo_check_macos]
    if: >
      !cancelled() && (needs.cargo_check_macos.result == 'success' || inputs.reuse_native_checks) &&
      (needs.changes.outputs.needs_build == 'true' || inputs.reuse_static_checks) && !inputs.reuse_linux_checks
    # Serialize compiling macOS jobs on the shared runner.
    runs-on: macrunner
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-native-checks

      - name: Enforce compact sidebar row actions
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'Enforce compact sidebar row actions') }}
        run: script/check-compact-row-actions
        shell: bash

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_on_failure: true
          is_self_hosted: false
          install_release_deps: false

      - name: Ensure rust target is installed
        run: rustup target add aarch64-apple-darwin
        shell: bash

      - name: cargo check (app and regression test targets)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo check (app and regression test targets)') }}
        run: cargo check --locked -p warp --tests
        shell: bash

      # Fast mechanism check (small crate, seconds to compile): proves that a
      # malformed platform-specific keybinding is rejected on ANY OS — including
      # every supported platform, including the native macOS runner.
      # `OperatingSystem::get()` is resolved at compile time, so without the
      # cross-platform validation in warpui_core::keymap a bad Mac binding
      # (`cmd-shift-o`) would slip past a Linux run entirely.
      - name: cargo test (keymap cross-platform validation)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (keymap cross-platform validation)') }}
        run: >
          cargo test --locked -p warpui_core --lib --
          test_mac_only_binding_validated_on_all_platforms
          test_valid_mac_only_binding_ok_on_all_platforms
          test_per_platform_off_platform_binding_validated
          test_keystroke_invalid_shift_lowercase
          test_keystroke_invalid_no_shift_uppercase
          test_svg_text_rasterizes_with_loaded_system_fonts
          core::app::startup_callback_tests::
        shell: bash

      - name: cargo test (SSH process-wrapper policy)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (SSH process-wrapper policy)') }}
        run: >
          cargo test --locked -p warp_ssh_manager --lib --
          ssh_workspace_has_no_direct_std_process_command
        shell: bash

      - name: cargo test (ECIES compatibility and managed-secret HPKE)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (ECIES compatibility and managed-secret HPKE)') }}
        run: cargo test --locked -p tink-hybrid -p warp_managed_secrets --lib
        shell: bash

      - name: cargo test (HTTP client construction smoke)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (HTTP client construction smoke)') }}
        run: >
          cargo test --locked -p http_client --lib --
          apply_off_disables_proxy_without_error
          apply_custom_with_valid_url_succeeds
        shell: bash

      - name: cargo test (OSS settings schema channel)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (OSS settings schema channel)') }}
        run: >
          cargo test --locked -p warp --bin generate_settings_schema --
          oss_channel_keeps_runtime_and_release_flags_without_internal_tiers
          unknown_channel_is_an_error
          channel_option_requires_a_value
        shell: bash

      - name: cargo test (retired BYOP compatibility and subscription isolation)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (retired BYOP compatibility and subscription isolation)') }}
        run: >
          cargo test --locked -p warp --lib --
          restored_conversation_drops_retired_byop_sidecars_on_next_persist
          identifies_provider_credentials_that_must_not_reach_cli_harnesses
          legacy_gemini_harness_is_not_runnable
          new_harness_picker_does_not_offer_legacy_gemini
          retired_byop_model_preferences_are_ignored_on_profile_roundtrip
          removes_all_retired_provider_secret_keys
          missing_retired_provider_secrets_are_already_clean
          provider_secret_cleanup_continues_after_a_storage_error
          retired_provider_secret_cleanup_is_wired_after_storage_registration
          retired_byop_settings_are_tolerated_without_eager_write
          retired_byop_settings_are_removed_on_next_normal_write
          claude_launch_uses_structured_protocol_and_subscription_environment
          claude_discovery_scrubs_all_provider_environment_variables
          remote_launch_quotes_working_directory_environment_and_model
          selected_subscription_accounts_scrub_provider_auth_environment
          legacy_conversation_without_message_timestamp_uses_row_timestamp
          unloaded_conversation_keeps_its_failed_last_turn
        shell: bash

      - name: cargo test (retired BYOP persistence compatibility)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (retired BYOP persistence compatibility)') }}
        run: >
          cargo test --locked -p persistence --lib --
          agent_conversation_data_does_not_reserialize_retired_sidecars
          model_token_usage_does_not_reserialize_retired_byok_fields
        shell: bash

      - name: cargo test (SQLite migration regressions)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (SQLite migration regressions)') }}
        run: cargo test --locked -p warp --lib persistence::sqlite::tests
        shell: bash

      - name: cargo test (subscription agent acceptance)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (subscription agent acceptance)') }}
        run: >
          cargo test --locked -p warp --lib ai::subscription_agent::
        shell: bash

      - name: cargo test (persistent session recovery and remote transport)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (persistent session recovery and remote transport)') }}
        run: |
          cargo test --locked -p warp --lib -- \
            remote_server::headless_connect::tests \
            remote_server::session_live::tests \
            terminal::daemon_tty::event_loop::tests \
            terminal::writeable_pty::pty_controller::tests \
            provisional_daemon_adoption_cleanup_covers_connection_and_tab
          cargo test --locked -p remote_server --lib client::tests
          cargo test --locked -p zap_sftp --lib session::tests
        shell: bash

      - name: cargo test (remote-server setup)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (remote-server setup)') }}
        run: cargo test --locked -p remote_server --lib setup::tests
        shell: bash

      - name: cargo test (remote subscription identity compatibility)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (remote subscription identity compatibility)') }}
        run: |
          cargo test --locked -p remote_server --lib older_client_ignores_provider_account_identity
          cargo test --locked -p remote_server --lib newer_client_decodes_missing_provider_account_identity_as_none
          cargo test --locked -p remote_server --lib old_agent_account_frame_defaults_provider_identity_to_none
        shell: bash

      - name: cargo test (retired Gemini CLI selection)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (retired Gemini CLI selection)') }}
        run: >
          cargo test --locked -p warp_cli --lib --
          harness_parse_orchestration_harness_rejects_legacy_gemini
        shell: bash

      # This bounded model suite includes deterministic scheduling/connection regressions.
      - name: cargo test (Cockpit refresh and connected hosts)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (Cockpit refresh and connected hosts)') }}
        run: |
          cargo test --locked -p zaplex_cockpit --lib fleet::tests
          cargo test --locked -p warp_cli --lib cockpit::tests
          cargo test --locked -p warp --lib cockpit::model::tests
        shell: bash

      # Each process initializes one locale; the global loader must not be
      # switched while unrelated tests assert English strings.
      - name: cargo test (spawn-card layout with real text metrics)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (spawn-card layout with real text metrics)') }}
        run: |
          for locale in en de; do
            ZAPLEX_SPAWN_LAYOUT_TEST_LOCALE="$locale" cargo test --locked -p warp --lib -- \
              spawn_card_long_model_options_stay_inside_the_window \
              spawn_card_errors_wrap_and_cancel_remains_reachable_after_resize
            ZAPLEX_COCKPIT_LAYOUT_TEST_LOCALE="$locale" cargo test --locked -p warp --lib -- \
              compact_cockpit_rows_wrap_real_text_when_resized
          done
        shell: bash

      # Focused app-crate unit tests: the FM-toggle + spawn-card launch payload,
      # catalog copy guard, plus the real boot/open smoke gate. Targeted by name so only these run —
      # the app crate's full test suite has known harness/env-dependent failures
      # unrelated to this gate.
      #
      # `test_boot_registers_all_keybindings_without_panicking` is the boot/open
      # smoke gate (#104): the app-test harness now registers the full singleton
      # graph, so it constructs a workspace window headless and runs the binding
      # registration path — catching both the keymap-crash class and "does the UI
      # wiring survive construction", the thing `cargo check` cannot.
      - name: cargo test (app dependency + UI smoke gates)
        if: ${{ !cancelled() && !contains(fromJSON(inputs.passed_regression_steps), 'cargo test (app dependency + UI smoke gates)') }}
        run: >
          cargo test --locked -p warp --lib -- --nocapture
          test_import_from_file
          file_manager_start_path_uses_session_cwd
          file_manager_start_path_falls_back_when_no_cwd
          view_components::action_button::tests::modal_close_icon_is_readable_on_light_surfaces
          view_components::action_button::tests::modal_close_icon_is_readable_on_dark_surfaces
          pane_group::tree::tests::
          pane_group::terminal_titles::tests::
          routed_agent_launch_waits_for_the_new_shell_without_losing_the_request
          routed_agent_fork_waits_for_shell_and_preserves_worktree_setup_order
          cockpit_opens_in_its_own_tab_and_refocuses_without_splitting_the_shell
          new_agent_tab_titles_distinguish_same_project_launches_without_renaming_tabs
          compact_session_metadata_preserves_full_model_host_and_worktree
          session_setup_recovery_remains_expanded_until_connection_refreshes_inventory
          file_manager_directory_
          same_fs_conflict_confirmation_rejects_a_closed_target_before_queue_submission
          same_fs_target_appearing_after_probe_is_skipped_without_overwrite_consent
          agent_leaf_separates_provider_from_the_exact_optional_model
          session_identity_avoids_only_exact_project_directory_duplication
          only_failed_connections_offer_a_connection_retry
          retry_after_host_key_dialog_cancel_starts_a_fresh_connection_attempt
          stale_connection_retry_does_not_restart_an_in_flight_or_connected_browser
          running_command_keeps_host_identity_in_pane_chrome
          cli_agent_summary_does_not_replace_terminal_host_identity
          pane_identity_follows_the_shell_across_a_manual_ssh_hop_and_exit
          bound_host_names_only_the_panes_own_shell
          file_manager_mode_keeps_the_host_and_directory_identity
          confirm_payload_carries_local_selection
          confirm_payload_routes_remote_launch_to_node_id
          confirm_payload_none_when_nothing_installed
          explicit_overwrite_rejects_change_after_revalidation_and_restores_newer_target
          absolute_path_segments_keep_absolute_navigation_targets
          relative_path_segments_keep_relative_navigation_targets
          root_path_has_exactly_one_root_segment
          breadcrumb_click_survives_rerender_between_mouse_down_and_up
          absolute_breadcrumb_click_lists_exact_ancestor
          absolute_root_breadcrumb_click_lists_root
          direct_skill_paths_reject_forbidden_components_for_qualified_and_unqualified_specs
          direct_skill_path_rejects_symlink_outside_root_before_parsing
          remote_su_echo_and_password_prompt_do_not_authorize_confirmation
          local_root_su_authorizes_exactly_one_confirmation
          non_root_remote_and_non_user_commands_do_not_arm_attempt
          timeout_later_command_and_session_change_clear_attempt
          earlier_timeout_does_not_clear_newer_attempt
          abort_or_shell_return_clear_attempt
          ui_copy_has_no_space_before_ellipsis
          agent_settings_copy_is_available_in_both_locales
