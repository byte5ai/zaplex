# PR validation pipeline — cargo check + targeted keymap-validation unit tests.
#
# Division of labour with zap_release.yml:
# - This workflow: runs a Linux cargo check on every PR (compile feedback), plus
#   a targeted `cargo test` that parse-validates every registered keybinding on
#   BOTH platform variants. `cargo check` compiles the code but never parses the
#   binding strings, so it cannot catch a malformed keybinding like `cmd-shift-o`
#   (must be `cmd-shift-O`) that compiles yet panics during registration. The
#   keymap-validation tests catch exactly that class. (A full window-open "does it
#   even open" test needs the app's live singleton graph, which the unit-test
#   harness cannot provide, so it is `#[ignore]`d rather than run here — see
#   `test_boot_registers_all_keybindings_without_panicking`.)
# - zap_release.yml: runs the full three-platform packaging (~3h) only on
#   tag push / manual dispatch.
#
# Only one platform (Linux): the Windows/macOS differences are mainly in the
# bundle stage rather than the cargo compile, and a Linux check already catches
# ~90% of compile errors; cross-platform issues are acceptable to surface at
# release-tag time.
#
# (Restored after being removed in cff5085e: the "release tag will catch it"
# rationale failed when an LLM-assisted change broke main between releases.)
#
# Cost guard (changes job): cargo_check + keymap_smoke_test each burn a real
# compile (~7-13 min billed) on every PR, including docs-only ones. The
# `changes` job below decides, via script/needs-build-check, whether the diff
# could possibly affect the build; the two expensive jobs then `if:`-skip
# their steps for docs-only PRs.
#
# Safety property (do NOT "simplify" this into a trigger-level `paths-ignore`
# on `on: pull_request:` — see no-new-cjk.yml's comment for the same warning):
# this workflow still triggers on EVERY pull_request unconditionally, so the
# `cargo check (Linux x86_64)` required-status-check context always gets a
# check-run. A job that is skipped via its own `if:` reports conclusion
# "skipped", which GitHub's required-status-checks treats as passing. A
# trigger-level path filter instead makes the whole workflow never run for
# excluded paths, so the check-run is never created at all — that leaves the
# required check permanently "pending" and blocks merging forever. The
# `changes` job itself always runs (it's a single cheap checkout + diff, not
# a compile) so it can never be the thing that goes missing.

name: PR Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Kept consistent with zap_release.yml — only the oss channel can
  # cargo build/check without the private warp-channel-config repo.
  CHANNEL: oss

jobs:
  changes:
    name: detect build-relevant changes
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.detect.outputs.needs_build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release tag classification
        run: script/classify-release-tag-tests
        shell: bash

      - name: Detect build-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # workflow_dispatch or similar: no PR diff to check against, so
            # always run the full build (safe default).
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_build=$(script/needs-build-check "$BASE_SHA")" >> "$GITHUB_OUTPUT"
        shell: bash

  cargo_check:
    name: cargo check (Linux x86_64)
    needs: changes
    if: needs.changes.outputs.needs_build == 'true'
    # Same runner as release_linux, glibc 2.35, to avoid deps differences that
    # only appear on ubuntu-latest.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Keep this inside the required cargo-check job: a regression fails the
      # required context before setup/compilation instead of failing `changes`
      # and turning this job into a branch-protection-passing "skipped" check.
      - name: Enforce compact sidebar row actions
        run: script/check-compact-row-actions
        shell: bash

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          # release_deps would install cargo-about, which check does not need;
          # build_deps already provide protoc / libdbus / pkg-config etc.
          install_release_deps: false

      - name: Ensure rust target is installed
        run: rustup target add x86_64-unknown-linux-gnu
        shell: bash

      - name: cargo check (default = zaplex bin)
        # `cargo check --workspace` would pull in wasm/preview channel-gated
        # targets; check only the default oss bin + its dependency graph, matching
        # the release_linux compile target. Cargo.lock is committed, so run --locked
        # for a deterministic graph (immune to upstream version drift).
        run: cargo check --locked --bin zaplex
        shell: bash

  keymap_smoke_test:
    name: keymap validation (Linux x86_64)
    needs: changes
    if: needs.changes.outputs.needs_build == 'true'
    # Runs in parallel with cargo_check so it does not delay compile feedback.
    # Same runner as cargo_check for consistent glibc/deps.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enforce compact sidebar row actions
        run: script/check-compact-row-actions
        shell: bash

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: false

      - name: Ensure rust target is installed
        run: rustup target add x86_64-unknown-linux-gnu
        shell: bash

      # Fast mechanism check (small crate, seconds to compile): proves that a
      # malformed platform-specific keybinding is rejected on ANY OS — including
      # this Linux runner — not only on the platform that actually uses it.
      # `OperatingSystem::get()` is resolved at compile time, so without the
      # cross-platform validation in warpui_core::keymap a bad Mac binding
      # (`cmd-shift-o`) would slip past a Linux run entirely.
      - name: cargo test (keymap cross-platform validation)
        run: >
          cargo test --locked -p warpui_core --lib --
          test_mac_only_binding_validated_on_all_platforms
          test_valid_mac_only_binding_ok_on_all_platforms
          test_per_platform_off_platform_binding_validated
          test_keystroke_invalid_shift_lowercase
          test_keystroke_invalid_no_shift_uppercase
        shell: bash

      # Focused app-crate unit tests: the FM-toggle + spawn-card launch payload,
      # catalog copy guard, plus the real boot/open smoke gate. Targeted by name so only these run —
      # the app crate's full test suite has known harness/env-dependent failures
      # unrelated to this gate.
      #
      # `test_boot_registers_all_keybindings_without_panicking` is the boot/open
      # smoke gate (#104): the app-test harness now registers the full singleton
      # graph, so it constructs a workspace window headless and runs the binding
      # registration path — catching both the keymap-crash class and "does the UI
      # wiring survive construction", the thing `cargo check` cannot.
      - name: cargo test (FM toggle + spawn-card + catalog + boot/open smoke gate)
        run: >
          cargo test --locked -p warp --lib --
          file_manager_start_path_uses_session_cwd
          file_manager_start_path_falls_back_when_no_cwd
          confirm_payload_carries_local_selection
          confirm_payload_routes_remote_launch_to_node_id
          confirm_payload_none_when_nothing_installed
          ui_copy_has_no_space_before_ellipsis
          spaced_ellipsis_detection_covers_catalog_whitespace_and_punctuation
          spaced_ellipsis_detection_ignores_comments_and_leading_ellipses
          test_boot_registers_all_keybindings_without_panicking
        shell: bash
