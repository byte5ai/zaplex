name: CI batch

# One approved post-merge run covers the selected main commit and all its merges.
# Christian authorizes each run with: release-approve "ci-batch.yml --ref main"
on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Optional build artifacts (the test DMG already includes the Linux daemon)
        type: choice
        options: [none, test-dmg, remote-server]
        default: none
      dmg_tag:
        description: Artifact version; empty uses the checked-out VERSION
        type: string
        default: ''
      coverage:
        description: Run the full suite with coverage, non-Rust evidence and the real Linux daemon acceptance
        type: boolean
        default: false
      per_test_coverage:
        description: With coverage, also attribute executed functions to each test and measure coverage without the pruning candidates (#472)
        type: boolean
        default: false
      checks_run_id:
        description: Successful checks-only main batch at this exact commit; build artifacts without repeating checks
        type: string
        default: ''
      resume_run_id:
        description: Failed main batch; reuse verified unchanged Linux or compile/SFTP/doc gates
        type: string
        default: ''
      resume_base_run_id:
        description: Earlier failed batch proving Linux/security when resuming only SFTP and artifacts
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate main batch
    runs-on: macrunner
    timeout-minutes: 5
    outputs:
      dmg_tag: ${{ steps.inputs.outputs.dmg_tag }}
      reuse_all_checks: ${{ steps.checks.outputs.reuse_all_checks }}
      reuse_checks: ${{ steps.resume.outputs.reuse_checks }}
      reuse_linux_checks: ${{ steps.resume.outputs.reuse_linux_checks }}
      reuse_pre_sftp_checks: ${{ steps.resume.outputs.reuse_pre_sftp_checks }}
      reuse_pre_policy_checks: ${{ steps.resume.outputs.reuse_pre_policy_checks }}
      reuse_native_checks: ${{ steps.resume.outputs.reuse_native_checks }}
      passed_regression_steps: ${{ steps.resume.outputs.passed_regression_steps }}
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Require a main dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]] || {
            echo "CI batches must be dispatched against main." >&2
            exit 1
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate artifact selection
        id: inputs
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          DMG_TAG: ${{ inputs.dmg_tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARTIFACTS" in none|test-dmg|remote-server) ;; *) exit 1 ;; esac
          tag="${DMG_TAG:-v$(tr -d '[:space:]' < VERSION)}"
          script/validate-release-tag "$tag"
          if [[ "$ARTIFACTS" == test-dmg && "$tag" != "v$(tr -d '[:space:]' < VERSION)" ]]; then
            echo "The test DMG tag must match VERSION." >&2
            exit 1
          fi
          echo "dmg_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate reuse of passed gates
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_BASE_RUN_ID: ${{ inputs.resume_base_run_id }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          python3 script/shell-ssh-runner-guard-tests
          python3 script/prepare-macos-rust-tests
          python3 script/ci-runner-policy-tests
          python3 script/ci-batch-scheduling-tests
          python3 script/ci-batch-resume-tests
          python3 script/ci-native-checks-resume-tests
          python3 script/ci-batch-resume

      - name: Preserve pre-policy provenance
        if: steps.resume.outputs.reuse_pre_policy_checks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-pre-policy-provenance
          path: ci-pre-policy-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve native gate and step provenance
        if: steps.resume.outputs.reuse_native_checks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-native-checks-provenance
          path: ci-native-checks-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify completed checks-only batch
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_RUN_ID: ${{ inputs.checks_run_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_BASE_RUN_ID: ${{ inputs.resume_base_run_id }}
          COVERAGE: ${{ inputs.coverage }}
          PER_TEST_COVERAGE: ${{ inputs.per_test_coverage }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          python3 script/ci-batch-checks-tests
          python3 script/ci-batch-checks
      - name: Preserve checks provenance
        if: steps.checks.outputs.reuse_all_checks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-checks-provenance
          path: ci-checks-provenance.json
          if-no-files-found: error
          retention-days: 7

  dependency_security:
    needs: preflight
    if: needs.preflight.outputs.reuse_all_checks != 'true' && needs.preflight.outputs.reuse_checks != 'true' && needs.preflight.outputs.reuse_linux_checks != 'true' && needs.preflight.outputs.reuse_pre_sftp_checks != 'true' && needs.preflight.outputs.reuse_pre_policy_checks != 'true' && needs.preflight.outputs.reuse_native_checks != 'true'
    uses: ./.github/workflows/dependency-security.yml

  compile_checks:
    needs: [preflight, dependency_security]
    if: >
      !cancelled() && needs.preflight.outputs.reuse_all_checks != 'true' && needs.preflight.result == 'success' && needs.preflight.outputs.reuse_checks != 'true' && needs.preflight.outputs.reuse_pre_sftp_checks != 'true' &&
      (needs.dependency_security.result == 'success' || needs.preflight.outputs.reuse_linux_checks == 'true' || needs.preflight.outputs.reuse_pre_policy_checks == 'true' || needs.preflight.outputs.reuse_native_checks == 'true')
    uses: ./.github/workflows/pr-check.yml
    with:
      reuse_static_checks: ${{ needs.preflight.outputs.reuse_pre_policy_checks == 'true' || needs.preflight.outputs.reuse_native_checks == 'true' }}
      reuse_native_checks: ${{ needs.preflight.outputs.reuse_native_checks == 'true' }}
      passed_regression_steps: ${{ needs.preflight.outputs.passed_regression_steps || '[]' }}
      reuse_linux_checks: ${{ needs.preflight.outputs.reuse_linux_checks == 'true' }}
    secrets: inherit

  tests:
    needs: [preflight, compile_checks]
    if: >
      !cancelled() && needs.preflight.outputs.reuse_all_checks != 'true' && needs.preflight.result == 'success' && needs.preflight.outputs.reuse_pre_sftp_checks != 'true' &&
      (needs.compile_checks.result == 'success' || needs.preflight.outputs.reuse_checks == 'true')
    uses: ./.github/workflows/test-dispatch.yml
    with:
      coverage: ${{ inputs.coverage }}
      per_test_coverage: ${{ inputs.per_test_coverage }}
      run_doc_tests: ${{ needs.preflight.outputs.reuse_checks != 'true' }}
    secrets: inherit

  live_sftp:
    needs: [preflight, compile_checks]
    if: >
      !cancelled() && needs.preflight.outputs.reuse_all_checks != 'true' && needs.preflight.result == 'success' && needs.preflight.outputs.reuse_checks != 'true' &&
      (needs.compile_checks.result == 'success' || needs.preflight.outputs.reuse_pre_sftp_checks == 'true')
    uses: ./.github/workflows/live-sftp-safety.yml
    secrets: inherit

  test_dmg:
    needs: [preflight, tests, live_sftp]
    if: >
      !cancelled() && inputs.artifacts == 'test-dmg' && needs.preflight.result == 'success' &&
      (needs.preflight.outputs.reuse_all_checks == 'true' || needs.tests.result == 'success' || needs.preflight.outputs.reuse_pre_sftp_checks == 'true') &&
      (needs.preflight.outputs.reuse_all_checks == 'true' || needs.live_sftp.result == 'success' || needs.preflight.outputs.reuse_checks == 'true')
    uses: ./.github/workflows/test-dmg.yml
    with:
      dmg_tag: ${{ needs.preflight.outputs.dmg_tag }}
      fast: false
    secrets: inherit

  remote_server:
    needs: [preflight, tests, live_sftp]
    if: >
      !cancelled() && inputs.artifacts == 'remote-server' && needs.preflight.result == 'success' &&
      (needs.preflight.outputs.reuse_all_checks == 'true' || needs.tests.result == 'success' || needs.preflight.outputs.reuse_pre_sftp_checks == 'true') &&
      (needs.preflight.outputs.reuse_all_checks == 'true' || needs.live_sftp.result == 'success' || needs.preflight.outputs.reuse_checks == 'true')
    uses: ./.github/workflows/build-remote-server.yml
    with:
      dmg_tag: ${{ needs.preflight.outputs.dmg_tag }}
    secrets: inherit

  completion:
    name: Verify all selected batch stages
    if: always()
    needs: [preflight, dependency_security, compile_checks, tests, live_sftp, test_dmg, remote_server]
    runs-on: macrunner
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reject missing required stages
        env:
          BATCH_NEEDS: ${{ toJSON(needs) }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: python3 script/ci-batch-completion
