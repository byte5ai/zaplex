name: macOS GUI acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to test (no app build)
        required: true
        type: string
      suite:
        description: All local flows or a diagnostic subset (not complete product acceptance)
        type: choice
        options: [full, terminal, navigation, surfaces]
        default: full
      only_tests:
        description: Optional comma-separated Class/testMethod names for diagnosis; forbidden with full
        required: false
        type: string
  workflow_call:
    inputs:
      artifact_name:
        description: DMG artifact from the calling workflow
        required: true
        type: string
      source_sha:
        description: Immutable source revision of the built app
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gui:
    name: Installed DMG user flows
    # ci-lint: allow-CI006  Manual/batch only; ephemeral VM without signing secrets
    runs-on: macrunner
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Verify GUI prerequisites
        run: macrunner-gui-check --prepare

      - name: Install CPU text recognition for the test runner
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install --force-bottle tesseract
          mkdir -p "$RUNNER_TEMP/gui-evidence"
          /opt/homebrew/bin/tesseract --version > "$RUNNER_TEMP/gui-evidence/ocr-version.txt"

      - name: Download existing release and verify asset digest
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          script/validate-release-tag "$RELEASE_TAG"
          mkdir -p "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/gui-evidence"
          gh api "repos/byte5ai/zaplex/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/gui-evidence/release.json"
          digest=$(jq -er '.assets[] | select(.name == "Zaplex-arm64.dmg") | .digest' "$RUNNER_TEMP/gui-evidence/release.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          asset_id=$(jq -er '.assets[] | select(.name == "Zaplex-arm64.dmg") | .id' "$RUNNER_TEMP/gui-evidence/release.json")
          gh api "repos/byte5ai/zaplex/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/dmg/Zaplex-arm64.dmg"
          printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/dmg/Zaplex-arm64.dmg" | shasum -a 256 -c -

      - name: Fetch DMG from this batch
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/dmg

      - name: Install unchanged app from DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP"/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]]
          bash script/macos/gui-tests/install-dmg "${dmgs[0]}" "$RUNNER_TEMP/gui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/gui-evidence/test-source-sha.txt"
          if [[ -n "$APP_SOURCE_SHA" ]]; then
            [[ "$APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse HEAD)" == "$APP_SOURCE_SHA" ]]
            printf '%s\n' "$APP_SOURCE_SHA" > "$RUNNER_TEMP/gui-evidence/app-source-sha.txt"
          fi
        env:
          APP_SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Exercise user flows in the installed app
        env:
          SUITE: ${{ inputs.artifact_name != '' && 'full' || inputs.suite || 'full' }}
          ONLY_TESTS: ${{ inputs.only_tests }}
        run: |
          echo "Local GUI suite: $SUITE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Remote, visual reference comparison and exploratory agent: not-run (see #562).' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SUITE" != full ]]; then
            echo 'Diagnostic subset only — not a full DMG acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
          bash script/macos/gui-tests/run "$RUNNER_TEMP/gui-evidence" "$SUITE" "$ONLY_TESTS"

      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-gui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gui-evidence/
          if-no-files-found: error
          retention-days: 14
