name: Dependency security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: macrunner
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check dependency baseline and temporary advisory exceptions
        run: python3 script/dependency-security-baseline-tests

      - uses: ./.github/actions/cargo-deny-native
        with:
          checks: advisories
