# Test-DMG-Pipeline — schlanker macOS-Build NUR fürs Testen.
#
# Baut ausschließlich das macOS-Build, das gerade getestet werden soll, und lädt
# es als Workflow-Artefakt hoch. KEIN Windows/Linux/Intel, KEIN GitHub-Release
# (anders als zap_release.yml). Gedacht für den schnellen Test-Loop — analog zu
# test-dispatch.yml für Rust-Tests.
#
# Aufruf:  gh workflow run test-dmg.yml -R byte5ai/zaplex --ref <branch> \
#            [-f arch=aarch64|x86_64] [-f dmg_tag=v0.daemontest]
#
# Das .dmg ist ad-hoc-signiert (wie zap_release.yml, --selfsign) → beim ersten
# Öffnen auf dem Mac einmal:  xattr -rd com.apple.quarantine /Applications/Zaplex.app
# (bzw. das .dmg), siehe issue #51. Kein Developer-ID/Notarize im OSS-Channel.
#
# `dmg_tag` wird als GIT_RELEASE_TAG eingebrannt und bestimmt den remote-server-
# Pfad, den der Client auf dem Ziel-Host prüft: ~/.zaplex/remote-server/zaplex-<tag>.
#
# Der Linux-remote-server (musl x86_64) wird als Tarball MIT ins DMG gebündelt
# (Contents/Resources/bundled/remote-server/) — der erste Connect auf einen
# Linux-x86_64-Host installiert den Daemon automatisch offline (Install-Leiter
# Rung 3a, siehe app/src/remote_server/embedded.rs). Manuelles Vorab-Platzieren
# via build-remote-server.yml ist damit nur noch für andere Plattformen nötig.

name: Test DMG

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "macOS-Architektur (aarch64 = Apple Silicon, x86_64 = Intel)"
        type: choice
        default: aarch64
        options:
          - aarch64
          - x86_64
      dmg_tag:
        description: "GIT_RELEASE_TAG (bestimmt den remote-server-Pfad auf dem Ziel-Host)"
        type: string
        default: v0.daemontest
      fast:
        description: "Schnell bauen (Debug-Profil: Minuten statt ~Stunde). Für Funktionstests. Aus = release-lto (langsam, optimiert)."
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CHANNEL: oss

jobs:
  # Linux remote-server tarball, bundled INTO the DMG (install ladder rung 3a):
  # first connect to a Linux x86_64 host auto-installs the persistent-session
  # daemon fully offline, version-matched to the client by construction (same
  # GIT_RELEASE_TAG). Mirrors build-remote-server.yml (static musl via zigbuild);
  # packed in the release-asset layout the install script expects (binary named
  # `zaplex` inside `zap-linux-x86_64.tar.gz`, see setup.rs tarball_basename()).
  build_remote_server:
    name: Build bundled remote-server (Linux musl x86_64)
    # Fast large runner (16 vCPU / 64 GB) — this is a static **musl** build, so the
    # glibc-consistency reason the client jobs pin `ubuntu-22.04` does not apply
    # here; the large Blacksmith runner is used precisely to speed up heavy builds.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Build the daemon ONCE and reuse it. `crates/remote_server` does NOT depend
      # on the client GUI (`app/**`), so UI-only iterations leave its compile inputs
      # unchanged → this cache hits and the whole ~30-40min build below is skipped
      # (only the tarball is restored + re-uploaded). Keyed by the daemon's inputs
      # (Cargo.lock + every workspace crate + toolchain + the bundle script) and the
      # release tag (baked into the binary): a change to any of them rebuilds and
      # re-caches, so it never serves a stale daemon.
      - name: Restore cached remote-server tarball
        id: daemon_cache
        uses: actions/cache@v4
        with:
          path: zap-linux-x86_64.tar.gz
          key: remote-server-musl-x86_64-${{ inputs.dmg_tag }}-${{ hashFiles('Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'script/bundle') }}

      - name: Free up disk space
        if: steps.daemon_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        if: steps.daemon_cache.outputs.cache-hit != 'true'
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install zig + cargo-zigbuild for static musl build
        if: steps.daemon_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          ZIG_VERSION="0.13.0"
          ZIG_DIR="$HOME/.local/zig-${ZIG_VERSION}"
          if [ ! -x "${ZIG_DIR}/zig" ]; then
            mkdir -p "${ZIG_DIR}"
            curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
              | tar -xJ -C "${ZIG_DIR}" --strip-components=1
          fi
          echo "${ZIG_DIR}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version ^0.19
        shell: bash

      - name: Build remote-server CLI (static musl via zigbuild)
        if: steps.daemon_cache.outputs.cache-hit != 'true'
        id: bundle_cli
        run: |
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --packages none \
            --target x86_64-unknown-linux-musl
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ inputs.dmg_tag }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          USE_ZIGBUILD: "true"
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Pack tarball in the release-asset layout
        if: steps.daemon_cache.outputs.cache-hit != 'true'
        # The staged-install script extracts the tarball and looks for the binary
        # under the client channel's `binary_name()` (= `zaplex` for oss), see
        # crates/remote_server/src/install_remote_server.sh.
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          cp "${{ steps.bundle_cli.outputs.executable_path }}" "$staging/zaplex"
          tar -czf zap-linux-x86_64.tar.gz -C "$staging" zaplex
          ls -lh zap-linux-x86_64.tar.gz
        shell: bash

      - name: Upload remote-server tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-remote-server-linux-x86_64
          path: zap-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build_dmg:
    name: Build Test DMG (macOS ${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 360
    needs: build_remote_server
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Stage the Linux remote-server tarball where prepare_bundled_resources
      # picks it up (resources/bundled/ → Zaplex.app/Contents/Resources/bundled/),
      # matching the runtime resolver app/src/remote_server/embedded.rs.
      - name: Fetch bundled remote-server tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zap-remote-server-linux-x86_64
          path: resources/bundled/remote-server/

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-${{ inputs.arch }}
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure rust target is installed
        run: rustup target add ${{ inputs.arch }}-apple-darwin
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      # --selfsign = ad-hoc-Signatur (kein Developer-ID-Cert nötig), identisch zu
      # zap_release.yml. dmg_name_suffix nur fürs Dateinaming.
      - name: Build ${{ inputs.arch }} bundle (ad-hoc signed)
        id: bundle_app
        run: |
          script/bundle --channel "$CHANNEL" --arch ${{ inputs.arch }} \
            --dmg-name-suffix "${{ inputs.arch == 'x86_64' && 'intel' || 'arm64' }}" --selfsign \
            ${{ inputs.fast && '--debug' || '' }}
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ inputs.dmg_tag }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-test-dmg-${{ inputs.arch }}
          path: ${{ steps.bundle_app.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7
