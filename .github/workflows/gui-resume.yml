name: Resume installed DMG acceptance

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Completed CI batch or Test DMG continuation with unfinished GUI acceptance
        type: string
        required: true
      source_sha:
        description: Original immutable app source commit (40 hex characters)
        type: string
        required: true

      only_tests:
        description: Optional failed Class/testMethod cases, comma-separated (diagnostic only)
        type: string
        default: ''
      current_tests:
        description: Use current main XCTest sources against the unchanged app
        type: boolean
        default: false
      explore:
        description: Open live exploration after the complete GUI suite passes
        type: boolean
        default: false
      remote_target:
        description: Prepare the isolated Linux target during exploration (private captures)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify existing DMG provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate original app source and successful artifact jobs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          APP_SOURCE_SHA: ${{ inputs.source_sha }}
          ONLY_TESTS: ${{ inputs.only_tests }}
        run: |
          python3 script/gui-resume-tests
          python3 script/macos/gui-tests/launcher_tests.py
          python3 script/gui-resume
          if [[ -n "$ONLY_TESTS" ]]; then
            python3 script/macos/gui-tests/report.py --validate-selection "$ONLY_TESTS"
          fi

  gui:
    needs: verify
    uses: ./.github/workflows/gui-acceptance.yml
    with:
      artifact_name: zap-test-dmg-aarch64
      artifact_run_id: ${{ inputs.artifact_run_id }}
      source_sha: ${{ inputs.source_sha }}
      test_source_sha: ${{ inputs.current_tests && github.sha || inputs.source_sha }}
      suite: ${{ inputs.only_tests != '' && 'navigation' || 'full' }}
      only_tests: ${{ inputs.only_tests }}

  explore:
    needs: [verify, gui]
    if: inputs.explore && inputs.only_tests == ''
    uses: ./.github/workflows/gui-explore.yml
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      source_sha: ${{ inputs.source_sha }}
      remote_target: ${{ inputs.remote_target }}
      after_full_suite: true
    secrets: inherit
