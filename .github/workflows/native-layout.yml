name: Targeted native layout verification

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Native layout scenario to verify
        type: choice
        options: [all, agent, connections-en, connections-de, files-en, files-de, ssh-form, terminal-introduction, file-manager-header, terminal-entry, file-actions, font-validation, pane-menu]
        default: all

permissions:
  contents: read

jobs:
  build:
    # ci-lint: allow-CI006  Main-only manual workflow; ephemeral VM per job
    runs-on: macrunner
    timeout-minutes: 60
    env:
      CHANNEL: oss
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # Rust 1.96 stripping can create unloadable proc-macro dylibs on macOS 27.
      # https://github.com/rust-lang/rust/issues/157750
      CARGO_PROFILE_DEV_STRIP: none
      CARGO_PROFILE_TEST_STRIP: none
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-aarch64-native-layout-nodebug
          cache_on_failure: true
          cache_workspace_crates: true
          is_self_hosted: false
          install_release_deps: false
      - name: Build native test executables once
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-build" /tmp/macrunner-operator
          printf 'repo=%s run=%s until=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(( $(date +%s) + 3600 ))" > /tmp/macrunner-operator/open
          python3 script/macos/native-build-metrics --seconds 3000 --interval 30 \
            --output /tmp/macrunner-operator/resources.jsonl \
            < /dev/null > "$RUNNER_TEMP/native-build/resource-sampler.log" 2>&1 &
          metrics_pid=$!
          finish_observation() {
            kill "$metrics_pid" 2>/dev/null || true
            wait "$metrics_pid" 2>/dev/null || true
            if [[ -f /tmp/macrunner-operator/open ]]; then
              mv /tmp/macrunner-operator/open /tmp/macrunner-operator/closed
            fi
          }
          trap finish_observation EXIT
          /usr/bin/time -l cargo test --locked -p integration --test integration --no-run --message-format=json -vv \
            > "$RUNNER_TEMP/native-build/compiler.jsonl" \
            2> >(tee "$RUNNER_TEMP/native-build/build.log" >&2)
          python3 - <<'PYTHON'
          import json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-build"
          executables = []
          harness = None
          for line in (dest / "compiler.jsonl").read_text().splitlines():
              if not line.startswith("{"):
                  continue
              item = json.loads(line)
              if item.get("reason") != "compiler-artifact" or not item.get("executable"):
                  continue
              if item["target"]["name"] != "integration":
                  continue
              path = pathlib.Path(item["executable"]).relative_to(root)
              executables.append(path)
              if "test" in item["target"]["kind"]:
                  harness = str(path)
          assert harness and pathlib.Path("target/debug/integration") in executables, executables
          with tarfile.open(dest / "executables.tar.gz", "w:gz") as archive:
              for path in set(executables):
                  archive.add(root / path, arcname=str(path))
          (dest / "manifest.json").write_text(json.dumps({
              "source_sha": os.environ["GITHUB_SHA"], "workspace": str(root), "harness": harness,
          }))
          PYTHON
      - name: Preserve compiled executables for failed-job retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-layout-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-build/executables.tar.gz
            ${{ runner.temp }}/native-build/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Collect build resource diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/macrunner-operator/resources.jsonl ]]; then
            mkdir -p "$RUNNER_TEMP/native-build"
            cp /tmp/macrunner-operator/resources.jsonl "$RUNNER_TEMP/native-build/resources.jsonl"
          fi
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-layout-compiler-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-build/build.log
            ${{ runner.temp }}/native-build/compiler.jsonl
            ${{ runner.temp }}/native-build/resource-sampler.log
            ${{ runner.temp }}/native-build/resources.jsonl
          if-no-files-found: warn
          retention-days: 14

  layout:
    needs: build
    # ci-lint: allow-CI006  Main-only manual workflow; ephemeral VM per job
    runs-on: macrunner
    timeout-minutes: 15
    env:
      CHANNEL: oss
      WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: '1'
      ZAPLEX_SHELL_PATH: /bin/zsh
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-aarch64-native-layout-nodebug
          is_self_hosted: false
          install_release_deps: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-layout-build-${{ github.sha }}
          path: ${{ runner.temp }}/native-build
      - name: Restore the verified native executables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          manifest = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-build/manifest.json").read_text())
          assert manifest["source_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["workspace"] == os.environ["GITHUB_WORKSPACE"]
          harness = pathlib.PurePosixPath(manifest["harness"])
          assert not harness.is_absolute() and ".." not in harness.parts
          assert harness.parts[:3] == ("target", "debug", "deps")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"NATIVE_LAYOUT_TEST_BIN={manifest['workspace']}/{harness}\n")
          PYTHON
          tar -xzf "$RUNNER_TEMP/native-build/executables.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Verify selected native layouts
        working-directory: crates/integration
        env:
          SCENARIO: ${{ inputs.scenario }}
          ZAPLEX_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/native-layout
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          case "$SCENARIO" in
            all) tests=(test_subscription_agent_conversation_layout_evidence test_native_workspace_empty_states_evidence test_native_workspace_empty_states_german_evidence test_native_workspace_file_managers_evidence test_native_workspace_file_managers_german_evidence test_native_ssh_form_evidence test_native_ssh_form_german_evidence test_native_terminal_introduction_evidence test_native_terminal_introduction_german_evidence test_native_file_manager_header_entry test_native_file_actions_evidence test_native_file_actions_german_evidence test_native_font_validation_evidence test_native_font_validation_german_evidence test_native_pane_menu_evidence test_native_pane_menu_german_evidence) ;;
            pane-menu) tests=(test_native_pane_menu_evidence test_native_pane_menu_german_evidence) ;;
            font-validation) tests=(test_native_font_validation_evidence test_native_font_validation_german_evidence) ;;
            file-actions) tests=(test_native_file_actions_evidence test_native_file_actions_german_evidence) ;;
            terminal-entry) tests=(test_native_terminal_introduction_evidence test_native_terminal_introduction_german_evidence test_native_file_manager_header_entry) ;;
            file-manager-header) tests=(test_native_file_manager_header_entry) ;;
            terminal-introduction) tests=(test_native_terminal_introduction_evidence test_native_terminal_introduction_german_evidence) ;;
            ssh-form) tests=(test_native_ssh_form_evidence test_native_ssh_form_german_evidence) ;;
            agent) tests=(test_subscription_agent_conversation_layout_evidence) ;;
            connections-en) tests=(test_native_workspace_empty_states_evidence) ;;
            connections-de) tests=(test_native_workspace_empty_states_german_evidence) ;;
            files-en) tests=(test_native_workspace_file_managers_evidence) ;;
            files-de) tests=(test_native_workspace_file_managers_german_evidence) ;;
            *) exit 1 ;;
          esac
          "$NATIVE_LAYOUT_TEST_BIN" --list > "$RUNNER_TEMP/native-layout-tests.txt"
          failed=0
          for test_name in "${tests[@]}"; do
            grep -Fx "ui_tests::$test_name: test" "$RUNNER_TEMP/native-layout-tests.txt"
            if ! "$NATIVE_LAYOUT_TEST_BIN" "ui_tests::$test_name" --exact --nocapture; then
              failed=1
              continue
            fi
            case "$test_name" in
              test_native_file_manager_header_entry)
                captures=(file-manager-header-before file-manager-header-after) ;;
              test_native_pane_menu*)
                captures=(pane-menu-dark-1024 pane-menu-canceled-dark-1024 pane-split-menu-dark-1024 pane-menu-shell-dark-1024 pane-menu-dark-760 pane-menu-canceled-dark-760 pane-split-menu-dark-760 pane-menu-shell-dark-760 pane-menu-light-1024 pane-menu-canceled-light-1024 pane-split-menu-light-1024 pane-menu-shell-light-1024 pane-menu-light-760 pane-menu-canceled-light-760 pane-split-menu-light-760 pane-menu-shell-light-760) ;;
              test_native_font_validation*)
                captures=(font-valid-before font-invalid-text font-invalid-range font-escape-restored font-same-value-corrected font-shell-preserved) ;;
              test_native_file_actions*)
                captures=(file-actions-selected file-actions-created-cursor file-actions-cancel-before file-actions-keyboard-after-cancel file-actions-rename-before file-actions-rename-after file-actions-details-tooltip file-actions-details-dialog file-actions-shell-preserved) ;;
              test_native_terminal_introduction*)
                captures=(terminal-introduction-dark-1024 terminal-introduction-dark-760 terminal-introduction-light-1024 terminal-introduction-light-760 terminal-introduction-dismissed) ;;
              test_native_ssh_form*)
                captures=(native-ssh-form-dark-1024 native-ssh-form-dark-760 native-ssh-form-light-1024 native-ssh-form-light-760 native-ssh-form-dark-again-1024 native-ssh-form-dark-again-760 native-ssh-form-invalid-test native-ssh-form-invalid-connect native-ssh-form-invalid-save) ;;
              test_subscription_agent_*)
                captures=(subscription-agent-normal-1180x640 subscription-agent-narrow-540x670 subscription-agent-recoverable-error-540x670) ;;
              test_native_workspace_empty_states*)
                captures=(native-empty-connections-dark-250 native-empty-connections-dark-320 native-empty-connections-dark-480 native-empty-connections-light-250 native-empty-connections-light-320 native-empty-connections-light-480 native-empty-favorites-dark native-empty-favorites-light) ;;
              test_native_workspace_file_managers*)
                captures=(native-file-managers-normal native-file-managers-narrow native-file-managers-normal-light native-file-managers-narrow-light native-file-manager-full-name native-file-manager-focused-action native-file-managers-restored-terminals) ;;
            esac
            for capture in "${captures[@]}"; do
              if ! find "$ZAPLEX_INTEGRATION_TEST_ARTIFACTS_DIR/$test_name" -type f -name "$capture.png" -size +0c -print -quit | grep -q .; then
                echo "::error::Missing capture: $test_name/$capture.png"
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Upload native layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-layout-${{ github.sha }}
          path: ${{ runner.temp }}/native-layout/
          if-no-files-found: error
          retention-days: 14
