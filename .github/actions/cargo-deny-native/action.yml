name: Native dependency policy
description: Run the pinned cargo-deny binary on the native macOS client platform.
inputs:
  checks:
    description: Space-separated cargo-deny checks
    required: true
runs:
  using: composite
  steps:
    - name: Prepare native Rust tools
      shell: bash
      run: bash script/prepare-macos-rust
    - name: Check dependency policy without a Linux container
      shell: bash
      env:
        DENY_CHECKS: ${{ inputs.checks }}
      run: |
        set -euo pipefail
        rustup show active-toolchain
        script/install-cargo-deny
        checks=()
        read -r -a checks <<< "$DENY_CHECKS"
        [[ ${#checks[@]} -gt 0 ]]
        for check in "${checks[@]}"; do
          case "$check" in advisories|bans|licenses|sources) ;; *) exit 2 ;; esac
        done
        "$RUNNER_TEMP/cargo-deny/bin/cargo-deny" --all-features --locked check "${checks[@]}"
