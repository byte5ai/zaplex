name: Feature Request
description: "Have an idea for zaplex? Search existing requests first and upvote if it already exists."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **zaplex's direction.** zaplex is a fork of Zap (the local-first Warp fork), rebuilt into a terminal cockpit for AI coding agents on remote machines:

        - **Persistent remote sessions** — agents survive disconnects, lid-close, and app restarts; sessions live in a daemon on the host, not in your SSH connection.
        - **Agent cockpit** — accounts, usage heat, and sessions waiting on you, across hosts and providers.
        - **Private by design** — reads only local data on your machines; no cloud account, no telemetry.
        - **A real terminal underneath** — Blocks, Workflows, Keymaps, themes from the Warp core, kept without its cloud.

        **Out of scope:** features that require Warp's cloud account, Warp AI gateway, Warp Drive cloud sync, Warpify SSO, billing, team/enterprise admin, or first-party telemetry.
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched zaplex feature requests](https://github.com/byte5ai/zaplex/issues?q=is%3Aissue+label%3Aenhancement) and there are no duplicates."
          required: true
        - label: "I have read the [zaplex README](https://github.com/byte5ai/zaplex#readme) and this feature is not already supported."
          required: true
        - label: "This request fits zaplex's direction (it does NOT require a cloud account, AI gateway, cloud sync, SSO, billing, or telemetry)."
          required: true
  - type: textarea
    id: "describe-solution"
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: "related-to-problem"
    attributes:
      label: "Is your feature request related to a problem? Please describe."
      description: "A clear and concise description of the underlying problem."
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: false
  - type: textarea
    id: "alignment"
    attributes:
      label: "How does this align with zaplex's direction?"
      description: "Briefly explain which axis it improves: remote sessions, agent cockpit/overview, privacy, preserved terminal UX, or maintainability of the upstream-sync workflow."
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Mockups, screenshots, links, references to similar tools (opencode, Zed, etc.), or upstream (Zap/Warp) behavior worth contrasting."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
        - All / not OS-specific
    validations:
      required: true
  - type: dropdown
    id: "importance"
    attributes:
      label: "How important is this feature to you?"
      multiple: false
      options:
        - "1 (Nice to have)"
        - "2"
        - "3"
        - "4"
        - "5 (Can't work without it)"
    validations:
      required: true
